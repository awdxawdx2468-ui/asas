<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أسس">
<meta name="application-name" content="أسس">
<meta name="description" content="حسابات مشاريعك وزبائنك بمكان واحد">
<title>أسس</title>
<meta name="theme-color" content="#14294A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: phone-first single column app, navy header band, white cards, bottom tab bar with yellow centre button */
:root{
  --navy:#14294A; --navy2:#1E3A66; --yel:#F5B800; --yeld:#E0A200; --cream:#FFF6DA;
  --green:#169C55; --greenbg:#E3F5EA; --red:#E04848; --redbg:#FCE8E8;
  --bg:#EEF2F8; --card:#FFFFFF; --ink:#14294A; --mut:#7A879C; --line:#E3E8F0; --soft:#F3F6FA;
  --c-mat:#14294A; --c-lab:#4F6D99; --c-eq:#E0A200; --c-tr:#C3CCDA; --c-oth:#9AA5B8;
  --f:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif; --f-cal:'Aref Ruqaa','Tajawal',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);direction:rtl;margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num,.amt{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative}
.top{background:var(--navy);color:#fff;padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.top.short{padding-bottom:22px}
.top::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.05);left:-70px;top:-90px}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.logo{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;font-size:20px;font-weight:800;line-height:1.25}
.brand p{margin:2px 0 0;font-size:13px;opacity:.75}
.ib{width:44px;height:44px;border-radius:13px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;margin-inline-start:auto;flex:none}
.ib svg{width:21px;height:21px}
.wrap{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.pull{margin-top:-52px;position:relative}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 6px 22px rgba(20,41,74,.07)}
.cash .lbl{color:var(--mut);font-size:14px}
.cash .big{font-size:38px;font-weight:800;margin:6px 0 14px;display:flex;align-items:baseline;gap:8px;justify-content:flex-start}
.cash .big small{font-size:15px;color:var(--mut);font-weight:500}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--soft);border-radius:14px;padding:10px 12px}
.mini span{display:block;font-size:12.5px;color:var(--mut)}
.mini b{font-size:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border:0;border-radius:18px;padding:16px;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.act i{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:20px}
.act.in{background:linear-gradient(135deg,#1DB45F,#128A4A)}
.act.out{background:linear-gradient(135deg,#F06262,#D63C3C)}
.sec{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.sec h2{font-size:18px;margin:0;font-weight:800}
.link{color:var(--yeld);font-weight:700;background:none;border:0;padding:4px}
.prj{background:var(--card);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;border:0;width:100%;text-align:right;box-shadow:0 4px 14px rgba(20,41,74,.05)}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.av.g{background:var(--greenbg);color:var(--green)}.av.r{background:var(--redbg);color:var(--red)}.av.y{background:var(--cream);color:var(--yeld)}
.prj .mid{flex:1;min-width:0}
.prj .nm{font-weight:800;font-size:16.5px}
.prj .sub{color:var(--mut);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;margin-inline-start:auto}
.prj .bal{text-align:left;flex:none}
.prj .bal b{font-size:16.5px;display:block}
.prj .bal span{font-size:12px;color:var(--mut)}
.pos{color:var(--green)}.neg{color:var(--red)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--cream);color:#8a6400}
.chip.g{background:var(--greenbg);color:var(--green)}.chip.r{background:var(--redbg);color:var(--red)}.chip.n{background:#E7ECF4;color:var(--navy)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -6px 20px rgba(20,41,74,.08);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;padding:6px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--navy);font-weight:800}
.fab{width:62px;height:62px;border-radius:20px;background:var(--yel);border:0;color:var(--navy);font-size:34px;font-weight:700;margin:-30px auto 2px;display:grid;place-items:center;box-shadow:0 8px 18px rgba(224,162,0,.45)}
.fabw{display:flex;flex-direction:column;align-items:center;font-size:12.5px;color:var(--mut)}
/* statements chooser + payment doc */
.stopt{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sth b{font-size:16px}.sth p{margin:4px 0 0;font-size:13px;color:var(--mut);line-height:1.6}
.ck2{display:flex;gap:8px;align-items:center;font-size:14px}.ck2 input{width:20px;height:20px}
.eq{background:#EEF2F8;border-radius:12px;padding:6px 14px;font-size:12px}
.eq div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #D3DAE6}
.eq div:last-child{border:0}.eq b{font-variant-numeric:tabular-nums;direction:ltr}
.eq .eqt{font-weight:800;font-size:13.5px}
.st-fin.negf{background:#8E1F1F}
.pgbrk{break-before:page;page-break-before:always;height:0}
@media screen{.pgbrk{height:18px;background:#5d6b80;margin:0}}
table.t.dense{font-size:9.6px}table.t.dense td{padding:1.5px 6px;line-height:1.3}table.t.dense th{padding:3px 6px}
table.t.dense .cat{font-size:8.5px;padding:0 5px;line-height:1.4}
.ax-h{background:var(--navy);color:#fff;padding:10px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--yeld);font-size:11px}
.ax-h b{font-size:14px}
/* clients */
.hint{background:#E7ECF4;border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.7;color:var(--navy)}
.ccard{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(20,41,74,.06);display:flex;flex-direction:column;gap:8px}
.chead{display:flex;align-items:center;gap:12px}
.chead .mid{flex:1;min-width:0}.chead .cn{font-weight:800;font-size:18px}.chead .s{font-size:12.5px;color:var(--mut)}
.chead .chip{border:0}
.plabel{font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.plist{border-inline-start:3px solid var(--yel);margin-inline-start:22px;padding-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--soft);border:0;border-radius:14px;padding:10px 12px;width:100%;text-align:right}
.pitem .pic{font-size:18px}.pitem .mid{flex:1;min-width:0}.pitem .t{font-weight:800}.pitem .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pb{text-align:left;flex:none}.pitem .pb b{display:block}.pitem .pb span{font-size:11.5px;color:var(--mut)}
.addp{border:1.5px dashed #CBD4E1;background:none;border-radius:12px;padding:8px;color:var(--navy);font-weight:700}
.ctot{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px}
/* forms */
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.1);border-radius:16px;padding:5px;margin-top:18px;position:relative}
.seg button{border:0;background:none;color:#fff;padding:12px;border-radius:12px;font-weight:800;font-size:18px;opacity:.85}
.seg .on.in{background:var(--green);opacity:1}.seg .on.out{background:var(--red);opacity:1}
.amtcard{text-align:center;padding:16px}
.amtcard label{color:var(--mut);font-size:14px}
.amtcard input{width:100%;border:0;text-align:center;font-size:40px;font-weight:800;outline:none;background:none;direction:ltr}
.amtcard .w{color:var(--mut);font-size:13.5px;min-height:20px}
.fld{background:var(--card);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 10px rgba(20,41,74,.04)}
.fld .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:19px}
.fld .bx{flex:1;min-width:0;display:flex;flex-direction:column}
.fld label{font-size:12.5px;color:var(--mut)}
.fld input,.fld select,.fld textarea{border:0;outline:none;background:none;font-weight:700;font-size:16.5px;padding:3px 0;width:100%}
.fld select{appearance:none;-webkit-appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:3px 10px;font-size:12.5px;color:var(--navy)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-weight:700;font-size:13.5px;color:var(--mut)}
.cats button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.photo{border:2px dashed #CBD4E1;border-radius:16px;padding:14px;text-align:center;color:var(--mut);background:#fff;display:block}
.photo img{max-height:120px;border-radius:10px;display:block;margin:0 auto 6px}
.btn{border:0;border-radius:16px;padding:16px;font-weight:800;font-size:18px;width:100%;background:var(--navy);color:#fff;display:flex;justify-content:center;gap:8px;align-items:center}
.btn.y{background:var(--yel);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px;width:auto}
.btn.del{background:#fff;color:var(--red);border:1.5px solid #F5C9C9}
.btn .ck{color:var(--yel)}
.hdr{display:flex;align-items:center;gap:12px;position:relative}
.hdr h1{margin:0;font-size:21px;font-weight:800}
.hdr p{margin:2px 0 0;font-size:13px;opacity:.75}
.back{width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;flex:none;margin-inline-start:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(20,41,74,.05)}
.kpi span{font-size:12.5px;color:var(--mut);display:block}
.kpi b{font-size:18px}
.kpi.hi{background:var(--yeld);color:var(--navy)}.kpi.hi span{color:var(--navy);opacity:.8}
.kpi.lo{background:var(--red);color:#fff}.kpi.lo span{color:#fff;opacity:.85}
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 12px rgba(20,41,74,.05)}
.li{display:flex;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:right}
.li:last-child{border-bottom:0}
.li .dt{font-size:12px;color:var(--mut)}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .a{font-weight:800;flex:none}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800}
.dot.in{background:var(--greenbg);color:var(--green)}.dot.out{background:var(--redbg);color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.trial{background:var(--cream);color:#7a5800;border-radius:14px;padding:10px 14px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.menu .li .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.note{font-size:12.5px;color:var(--mut);line-height:1.6}
.log{font-size:12.5px;color:var(--mut);background:var(--soft);border-radius:12px;padding:10px 12px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.log div:last-child{border:0}
details summary{cursor:pointer;font-weight:700;color:var(--navy);padding:6px 0}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:19px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;z-index:60;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:90%}
/* document view */
#doc{display:none;position:fixed;inset:0;background:#5d6b80;z-index:40;overflow:auto}
#doc.show{display:block}
.docbar{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.docbar b{flex:1;font-size:16px}
.docbar button{border:0;border-radius:11px;padding:9px 14px;font-weight:800;background:rgba(255,255,255,.12);color:#fff}
.docbar button.y{background:var(--yel);color:var(--navy)}
.paperwrap{padding:16px 0 40px;display:flex;justify-content:center}
.paper{width:794px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);color:#1b2a44;font-size:13px;flex:none}
/* statement styles */
.st-h{background:var(--navy);color:#fff;padding:28px 34px 24px;display:flex;align-items:center;gap:20px;border-bottom:7px solid var(--yeld)}
.st-logo{width:96px;height:96px;border-radius:20px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.st-logo img{width:100%;height:100%;object-fit:contain}
.st-co{flex:1}
.st-co .en{font-family:var(--f-cal);font-size:34px;line-height:1.2}
.st-co .cn{color:var(--yeld);font-weight:800;font-size:17px;letter-spacing:.3px;margin-top:2px}
.st-co .ad{font-size:12.5px;opacity:.75;margin-top:6px}
.st-tt{text-align:left}
.st-tt h1{margin:0;font-size:30px;font-weight:800;padding-bottom:8px;border-bottom:4px solid var(--yeld);display:inline-block}
.st-tt div{font-size:12.5px;opacity:.75;margin-top:10px}
.st-b{padding:22px 34px 0}
.st-info{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.st-box{background:#EEF2F8;border-radius:14px;padding:14px 16px;line-height:1.85}
.st-box h4{margin:0 0 2px;font-size:13.5px}
.st-box .big{font-size:20px;font-weight:800}
.st-box .m{color:#6b7891}
.st-k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.st-k div{border:1.5px solid #E1E7F0;border-radius:14px;padding:12px 14px;border-left:5px solid var(--navy)}
.st-k div:nth-child(2){border-left-color:var(--red)}
.st-k div:nth-child(3){border-left-color:var(--yeld)}
.st-k div:last-child{background:var(--yeld);border-color:var(--yeld)}
.st-k div.negb{background:var(--red);border-color:var(--red);color:#fff}
.st-k span{display:block;color:#6b7891;font-size:12.5px}
.st-k div:last-child span{color:var(--navy)}
.st-k div.ein{border-left-color:var(--green)}.st-k div.eout{border-left-color:var(--red)}.st-k div.efee{border-left-color:var(--yeld)}.st-k div.eprev{border-left-color:var(--navy)}
.st-k div.negb,.st-k div.negb:last-child{background:var(--red);border-color:var(--red);color:#fff}.st-k div.negb span{color:#fff}
.st-k div.negb span{color:#fff}
.st-k b{font-size:19px;font-variant-numeric:tabular-nums}
.st-k small{font-size:11px;font-weight:500;margin-inline-start:3px}
.st-h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:16px 0 8px}
.st-h3::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--yeld)}
.st-2{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.t th{background:var(--navy);color:#fff;font-weight:700;padding:8px 10px;text-align:right}
table.t th:first-child{border-radius:0 10px 10px 0}
table.t th:last-child{border-radius:10px 0 0 10px}
table.t td{padding:7px 10px;border-bottom:1px solid #E6EBF2}
table.t tbody tr:nth-child(even) td{background:#F6F8FB}
table.t .n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
table.t tr.tot td{background:var(--cream)!important;font-weight:800;border:0}
table.t tr.tot td:first-child{border-radius:0 10px 10px 0}
table.t tr.tot td:last-child{border-radius:10px 0 0 10px}
table.t thead{display:table-header-group}
table.t tr{break-inside:avoid}
.g{color:var(--green)}.r{color:var(--red)}.mut{color:#7d8aa1}
.cat{display:inline-block;padding:1px 9px;border-radius:9px;font-size:11.5px;font-weight:800;background:var(--cream);color:#7a5800}
.donut{display:flex;align-items:center;gap:16px}
.leg{flex:1;font-size:12.5px}
.leg div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #DCE2EC}
.leg i{width:12px;height:12px;border-radius:4px;flex:none}
.leg b{margin-inline-start:auto;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums;direction:ltr}
.st-fin{background:var(--navy);color:#fff;border-radius:16px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px;break-inside:avoid}
.st-fin h3{margin:0;font-size:18px}

  if(!F.amt)return toast('اكتب المبلغ');if(!okDate(F.date))return toast('التاريخ بالأرقام هكذا: 2026-11-19');if(!F.pid)return toast('اختر المشروع');
  if(F.kind==='out'&&!F.cat)F.cat=autoCat(F.det);if(F.kind==='in')F.cat='';
  const doSave=()=>{if(F.id){const i=S.entries.findIndex(e=>e.id===F.id);const old=S.entries[i];const ch=[];
      for(const k of Object.keys(FIELDN))if(String(old[k]??'')!==String(F[k]??''))ch.push(`${FIELDN[k]}: ${k==='amt'?fmt(old[k]):k==='cat'?CATN[old[k]]||'':k==='pid'?(P(old[k])||{}).name:old[k]||'—'} ← ${k==='amt'?fmt(F[k]):k==='cat'?CATN[F[k]]||'':k==='pid'?(P(F[k])||{}).name:F[k]||'—'}`);

const PAGE_H=1122;
const strip=(i,n)=>{const g=DOCMETA.sigs||['المحاسب','المهندس المشرف',(DOCMETA.client||'صاحب العلاقة')+': اطّلعت ودقّقت'];return `<div class="st-sig pg"><div>${esc(g[0])}</div><div>${stampHtml()}${esc(g[1])}</div><div>${esc(g[2])}</div></div><div class="pgno">ورقة <b>${i}</b> من <b>${n}</b> · رقم الكشف <b class="num">${esc(DOCMETA.no)}</b> · رمز <b class="num">${DOCMETA.ref}</b></div>`};
function hashCode(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h.toString(36).toUpperCase().slice(-5).padStart(5,'0')}
let DOCMETA={};
function docOpen(title,html,meta={}){const d=$('#doc');const ref=hashCode(html);html=html.split('%REF%').join(ref);
  DOCMETA=Object.assign({title,ref,no:'',date:today(),who:''},meta,{ref});
  d.innerHTML=`<div class="docbar"><button onclick="docClose()">→ رجوع</button><b>${esc(title)} <span class="pages" id="pages"></span></b><button class="y" onclick="doPrint()">طباعة / PDF</button></div><div class="paperwrap"><div class="pscale" id="pscale"><div class="book" id="paper"></div></div></div><div class="paper measure" id="measure">${html}</div>`;
  d.classList.add('show');d.scrollTop=0;paginate($('#measure'),$('#paper'));$('#measure').remove();fitPaper()}
function paginate(src,out){const M=DOCMETA;const pages=[];let page,body;const H=src.querySelector('.st-h');
  const newPage=()=>{page=document.createElement('div');page.className='paper apage';
    if(pages.length){if(H){const h=H.cloneNode(true);const t=h.querySelector('.st-tt');if(t)t.innerHTML=`<h1>${esc(M.title)}</h1><div>رقم <b class="num">${esc(M.no)}</b> · <span class="num">${M.date}</span> · رمز <b class="num">${M.ref}</b></div>`;page.appendChild(h)}
      page.insertAdjacentHTML('beforeend',`<div class="conth"><span><b>تابع</b> — ${esc(M.title)}</span><span>${esc(M.client||M.who)}</span><span class="pgx"></span></div>`)}
    body=document.createElement('div');body.className='sbody';page.appendChild(body);
    const f=document.createElement('div');f.className='sfoot';f.innerHTML=strip(1,1)+'<div class="sline">.</div>';page.appendChild(f);out.appendChild(page);pages.push(page)};
  const fits=()=>body.scrollHeight<=body.clientHeight+1;
  const curB=()=>{let b=body.lastElementChild;if(!b||!b.classList.contains('st-b')){b=document.createElement('div');b.className='st-b';body.appendChild(b)}return b};
  const brk=()=>{const b=body.lastElementChild;const prev=b&&b.classList.contains('st-b')?b.lastElementChild:null;
    if(prev&&prev.classList.contains('st-h3')){prev.remove();newPage();curB().appendChild(prev)}else newPage()};
  const put=(n,inB)=>{(inB?curB():body).appendChild(n);if(fits())return;n.remove();if(inB)brk();else newPage();(inB?curB():body).appendChild(n)};
  const putTable=t=>{const head=t.tHead,rows=[...t.tBodies[0].rows];let tb;
    const start=()=>{const nt=document.createElement('table');nt.className=t.className;nt.appendChild(head.cloneNode(true));tb=document.createElement('tbody');nt.appendChild(tb);curB().appendChild(nt);return nt};
    let nt=start();
    for(const r of rows){tb.appendChild(r);if(fits())continue;r.remove();if(!tb.rows.length){nt.remove();brk()}else newPage();nt=start();tb.appendChild(r)}};
  newPage();
  for(const top of [...src.children]){
    if(top.classList.contains('pgbrk')){if(body.children.length)newPage();continue}
    if(top.classList.contains('st-b')){for(const ch of [...top.children]){if(ch.matches('table.t'))putTable(ch);else put(ch,true)}continue}
    put(top,false)}
  const n=pages.length;
  pages.forEach((pg,i)=>{const px=pg.querySelector('.pgx');if(px)px.innerHTML=`ورقة <b>${i+1}</b> من <b>${n}</b>`;const last=i===n-1;pg.querySelector('.sfoot').innerHTML=
    strip(i+1,n)+
    `<div class="sline"><span>${esc(S.co.short||S.co.name)} · ${esc(M.title)} · رقم <b class="num">${esc(M.no)}</b> · <span class="num">${M.date}</span> · رمز <b class="num">${M.ref}</b> · ورقة ${i+1} من ${n}</span><span>${PLATFORM.footer} · للاشتراك: <span class="num">${PLATFORM.phone}</span></span></div>`});
  const b=$('#pages');if(b)b.textContent=n===1?'· ورقة A4 واحدة':`· ${n} أوراق A4`}
function fitPaper(){const p=$('#paper'),w=$('#pscale');if(!p)return;p.style.transform='none';const h=p.offsetHeight;const z=Math.min(1,(document.documentElement.clientWidth-16)/794);
  p.style.transform=`scale(${z})`;w.style.width=794*z+'px';w.style.height=h*z+'px'}
addEventListener('resize',fitPaper);
function docClose(){$('#doc').classList.remove('show');$('#doc').innerHTML=''}
function doPrint(){try{window.print()}catch(e){}setTimeout(()=>toast('إن لم تظهر نافذة الطباعة: افتح التطبيق في المتصفح مباشرة'),800)}
function docHead(title,sub){const c=S.co;return `<div class="st-h"><div class="st-logo">${c.logo?`<img src="${c.logo}" alt="">`:defLogo(64)}</div>
  <div class="st-co">${c.order==='co'?`<div class="cn1">${esc(c.name)}</div><div class="en2">${esc(c.eng)}</div>`:c.order==='coonly'?`<div class="en">${esc(c.name)}</div>`:c.order==='engonly'?`<div class="en">${esc(c.eng)}</div>`:`<div class="en">${esc(c.eng)}</div><div class="cn">${esc(c.name)}</div>`}<div class="ad">${esc(c.city)} · <span class="num">${esc(c.phone)}</span></div></div>
  <div class="st-tt"><h1>${esc(title)}</h1><div>${sub} · رمز <b class="num">%REF%</b></div></div></div>`}
function docFoot(){return `<div class="st-f"><span>${esc(S.co.short||S.co.name)} · <b>${esc(S.co.city)}</b></span><span>${PLATFORM.footer} · للاشتراك: <span class="num">${PLATFORM.phone}</span></span></div>`}
function donut(byCat,total){const R=62,L=2*Math.PI*R;let off=0;const segs=CATS.filter(c=>byCat[c.k]).map(c=>{const f=byCat[c.k]/total;const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${c.h}" stroke-width="26" stroke-dasharray="${f*L} ${L}" stroke-dashoffset="${-off*L}"/>`;off+=f;return s}).join('');
  const m=total>=1e6?(total/1e6).toFixed(1).replace(/\.0$/,'')+' م':fmt(total);
  return `<svg width="160" height="160" viewBox="0 0 160 160" style="flex:none"><g transform="rotate(-90 80 80)">${segs||`<circle r="${R}" cx="80" cy="80" fill="none" stroke="#E3E8F0" stroke-width="26"/>`}</g>
   <text x="80" y="74" text-anchor="middle" font-size="11" fill="#7d8aa1" font-family="Tajawal">المصروف</text><text x="80" y="94" text-anchor="middle" font-size="17" font-weight="800" fill="#14294A" font-family="Tajawal">${m}</text></svg>`}
/* ---- الكشوف: دفعة / نهائي / فترة ---- */
const ORD=['','الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
const ordN=i=>ORD[i]||('رقم '+i);
/* توزيع المصروفات على الدفعات: كل مصروف يُحسب على آخر دفعة استُلمت قبله */
function pays(p){const es=entriesOf(p.id);const pct=p.feeType==='pct'?(+p.feeVal||0)/100:0;
  const L=es.filter(e=>e.kind==='in').map((e,i)=>({i:i+1,e,outs:[],fee:Math.round(e.amt*pct)}));if(!L.length)return L;
  let cur=0;for(const e of es){if(e.kind==='in')cur=L.findIndex(x=>x.e===e);else L[cur].outs.push(e)}
  let open=0;L.forEach((x,j)=>{x.open=open;x.spent=x.outs.reduce((a,e)=>a+e.amt,0);x.close=open+x.e.amt-x.fee-x.spent;open=x.close;
    x.to=L[j+1]?L[j+1].e.date:(x.outs.length?x.outs[x.outs.length-1].date:x.e.date);x.last=!L[j+1]});
  return L}
function catsOf(outs){const b={};for(const e of outs)b[e.cat]=(b[e.cat]||0)+e.amt;return b}
function matsOf(outs){const m={};for(const e of outs)if(e.cat==='mat'&&e.mat&&e.qty){const k=e.mat.trim();const r=m[k]||(m[k]={name:k,unit:e.unit||'',qty:0,amt:0});r.qty+=+e.qty;r.amt+=e.amt}return Object.values(m)}
const stampHtml=()=>`<span class="stamp">${S.co.stamp?`<img src="${S.co.stamp}" alt="">`:esc(S.co.stampText||S.co.short)}</span>`;
function stInfo(p,c,details){return `<div class="st-info"><div class="st-box"><h4>الزبون والمشروع</h4><div class="big">${esc(c.title?c.title+' ':'')}${esc(c.name)}</div>
  <div class="m">${esc(p.name)}${p.desc?' · '+esc(p.desc):''}${p.loc?' · '+esc(p.loc):''}</div><div><span class="m">الهاتف:</span> <b class="num">${esc(c.phone||'')}</b></div></div>
  <div class="st-box"><h4>تفاصيل الكشف</h4>${details}</div></div>`}
function stKpis(a){return `<div class="st-k" style="grid-template-columns:repeat(${a.length},1fr)">${a.map(([l,v,cls])=>`<div class="${cls||''} ${/السابقة|قبل الفترة/.test(l)?'eprev':/مصروف|المصروف/.test(l)?'eout':/أتعاب/.test(l)?'efee':/مقبوض|الدفعة/.test(l)?'ein':''}"><span>${l}</span><b>${v<0?'−':''}${fmt(Math.abs(v))}</b><small>د.ع</small></div>`).join('')}</div>`}
function stDonut(b,t){return `<div class="donut">${donut(b,t)}<div class="leg">${CATS.filter(x=>b[x.k]).sort((x,y)=>b[y.k]-b[x.k]).map(x=>`<div><i style="background:${x.h}"></i>${x.n}<b>${fmt(b[x.k])} · ${Math.round(b[x.k]/t*100)}%</b></div>`).join('')||'<div>لا مصروفات</div>'}</div></div>`}
function stOuts(outs,dense){let cum=0;return `<table class="t ${dense?'dense':''}"><thead><tr><th>ت</th><th>التاريخ</th><th>البيان</th><th>البند</th><th>المدفوع له</th><th>المستند</th><th class="n">المبلغ (د.ع)</th><th class="n">التراكمي</th></tr></thead><tbody>
  ${outs.map((e,i)=>{cum+=e.amt;return `<tr><td>${i+1}</td><td class="num">${e.date}</td><td>${esc(e.det)}</td><td><span class="cat">${CATN[e.cat]||''}</span></td><td>${esc(e.party)}</td><td>${e.docType==='بدون مستند'?'—':esc(e.docType)+' <span class="num">'+esc(e.docNo)+'</span>'}</td><td class="n r">${fmt(e.amt)}</td><td class="n mut">${fmt(cum)}</td></tr>`}).join('')||'<tr><td colspan="8" class="mut">لا توجد مصروفات</td></tr>'}
  <tr class="tot"><td colspan="6">مجموع المصروفات</td><td class="n">${fmt(cum)}</td><td></td></tr></tbody></table>`}
let STM={mode:'sum',annex:false};
/* مختصر: سطر لكل مادة أو بند */
function itemKey(e){if(e.cat==='mat')return e.mat?e.mat.trim():String(e.det||'مواد').replace(/[\d.,]+/g,'').replace(/\b(كيس|طن|قطعة|م³|م²|حمل|لتر)\b/g,'').replace(/\s+/g,' ').trim()||'مواد';
  if(e.cat==='lab')return 'أجور '+(e.party||'عمال');if(e.cat==='eq')return 'آليات · '+(e.party||'');if(e.cat==='tr')return 'نقل';return String(e.det||'أخرى').replace(/[\d.,]+/g,'').trim()||'أخرى'}
function stSum(outs){const g={};for(const e of outs){const k=e.cat+'|'+itemKey(e);const r=g[k]||(g[k]={cat:e.cat,name:itemKey(e),n:0,amt:0,qty:0,unit:'',from:e.date,to:e.date});
    r.n++;r.amt+=e.amt;if(e.qty){r.qty+=+e.qty;r.unit=e.unit||r.unit}if(e.date<r.from)r.from=e.date;if(e.date>r.to)r.to=e.date}
  const ord=Object.fromEntries(CATS.map((c,i)=>[c.k,i]));const rows=Object.values(g).sort((a,b)=>ord[a.cat]-ord[b.cat]||b.amt-a.amt);const t=outs.reduce((a,e)=>a+e.amt,0);
  return `<table class="t"><thead><tr><th>البند</th><th>المادة / العمل</th><th class="n">عدد الوصولات</th><th>الكمية</th><th>الفترة</th><th class="n">المبلغ (د.ع)</th><th class="n">النسبة</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><span class="cat">${CATN[r.cat]||''}</span></td><td><b>${esc(r.name)}</b></td><td class="n">${r.n}</td><td>${r.qty?'<span class="num">'+(+r.qty).toLocaleString('en-US')+'</span> '+esc(r.unit):'—'}</td><td class="mut" style="white-space:nowrap">${r.from===r.to?'<span class="num">'+r.from+'</span>':'<span class="num">'+r.from+'</span> إلى <span class="num">'+r.to+'</span>'}</td><td class="n r"><b>${fmt(r.amt)}</b></td><td class="n mut">${t?Math.round(r.amt/t*100):0}%</td></tr>`).join('')||'<tr><td colspan="7" class="mut">لا توجد مصروفات</td></tr>'}
  <tr class="tot"><td colspan="2">مجموع المصروفات</td><td class="n">${outs.length}</td><td></td><td></td><td class="n">${fmt(t)}</td><td class="n">100%</td></tr></tbody></table>`}
function stExp(outs,title){return STM.mode==='sum'?`<div class="st-h3">${title} <span class="mut" style="font-weight:500;font-size:10.5px">(مختصر: كل مادة أو بند بسطر)</span></div>${stSum(outs)}`
  :`<div class="st-h3">${title}</div>${stOuts(outs,true)}${stMats(matsOf(outs))}`}
function annexDoc(p,outs,label){const c=C(p.cid)||{};return `<div class="pgbrk"></div><div class="ax-h"><b>ملحق: تفاصيل ${label}</b><span>${esc(c.name)} · ${esc(p.name)} · ${outs.length} مصروف</span></div><div class="st-b">${stOuts(outs,true)}</div>`}
function stMats(ms){return ms.length?`<div class="keep"><div class="st-h3">المواد</div><table class="t"><thead><tr><th>المادة</th><th>الوحدة</th><th class="n">الكمية</th><th class="n">متوسط سعر الوحدة (د.ع)</th><th class="n">المجموع (د.ع)</th></tr></thead><tbody>
  ${ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.unit)}</td><td class="n">${(+m.qty).toLocaleString('en-US')}</td><td class="n">${fmt(m.amt/m.qty)}</td><td class="n">${fmt(m.amt)}</td></tr>`).join('')}</tbody></table></div>`:''}
function stTail(bal,title,negTitle,note,client){return `<div class="keep"><div class="st-fin ${bal<0?'negf':''}"><div><h3>${bal<0?negTitle:title}</h3><p>فقط ${words(bal)} دينار عراقي لا غير</p></div><b>${bal<0?'−':''}${fmt(Math.abs(bal))} د.ع</b></div>
  <div class="st-note">${note}${S.demo?' · <b>بيانات تجريبية</b>':''}</div></div>`}
const stNo=p=>String(live(S.projects).indexOf(p)+1).padStart(3,'0');

/* كشف دفعة واحدة */
function payDoc(p,x,withAnnex){const c=C(p.cid)||{};const b=catsOf(x.outs);const pct=p.feeType==='pct';
  const kp=[];if(x.i>1)kp.push([x.open<0?'تجاوز من الدفعة السابقة':'متبقٍ من الدفعة السابقة',x.open]);
  kp.push(['مبلغ الدفعة '+ordN(x.i),x.e.amt]);if(pct)kp.push([`أتعاب المهندس ${+p.feeVal}%`,x.fee]);kp.push(['مصروف هذه الدفعة',x.spent]);
  kp.push([x.close<0?'تجاوز (يُخصم من الدفعة القادمة)':(x.last?'المتبقي من الدفعة':'المتبقي (دُوِّر للدفعة التالية)'),x.close,x.close<0?'negb':'']);
  const eq=`<div class="eq">${x.i>1?`<div><span>${x.open<0?'تجاوز سابق':'متبقٍ سابق'}</span><b class="${x.open<0?'r':''}">${sfmt(x.open)}</b></div>`:''}
    <div><span>+ الدفعة ${ordN(x.i)}</span><b class="g">${fmt(x.e.amt)}</b></div>${pct?`<div><span>− أتعاب المهندس</span><b>${fmt(x.fee)}</b></div>`:''}
    <div><span>− المصروفات (${x.outs.length})</span><b class="r">${fmt(x.spent)}</b></div><div class="eqt"><span>= ${x.close<0?'التجاوز':'المتبقي'}</span><b class="${x.close<0?'r':''}">${sfmt(x.close)}</b></div></div>`;
  return docHead('كشف الدفعة '+ordN(x.i),`رقم <span class="num">د-${stNo(p)}-${x.i}</span> · <span class="num">${today()}</span>`)+`<div class="st-b">
   ${stInfo(p,c,`<div><span class="m">الدفعة:</span> <b>${ordN(x.i)}</b> · <b class="num">${fmt(x.e.amt)}</b> د.ع · <span class="num">${x.e.no}</span></div>
     <div><span class="m">استُلمت:</span> <b class="num">${x.e.date}</b> · <span class="m">آخر صرف منها:</span> <b class="num">${x.outs.length?x.outs[x.outs.length-1].date:'—'}</b></div>
     <div><span class="m">الأتعاب:</span> <b>${esc(feeLabel(p))}</b> · <span class="m">المهندس:</span> <b>${esc(S.me)}</b></div>`)}
   ${stKpis(kp)}
   <div class="st-2"><div><div class="st-h3">حساب الدفعة</div>${eq}</div><div><div class="st-h3">أين صُرفت الدفعة</div>${stDonut(b,x.spent)}</div></div>
   ${stExp(x.outs,'مصروفات الدفعة '+ordN(x.i))}
   ${stTail(x.close,x.last?'المتبقي من الدفعة':'المتبقي ويُدوَّر للدفعة التالية','تجاوز الدفعة (يُخصم من الدفعة القادمة)',
     `المصروفات تُحسب على آخر دفعة مستلمة قبلها حسب التاريخ.${p.feeType==='fixed'?' الأتعاب المقطوعة تُحسب في الكشف النهائي.':''}${STM.mode==='sum'?(withAnnex?' تفاصيل كل وصل في الملحق.':' التفاصيل وصلاً بوصل متوفرة عند الطلب.'):''}`)}</div>`+(withAnnex&&STM.mode==='sum'&&x.outs.length?annexDoc(p,x.outs,'مصروفات الدفعة '+ordN(x.i)):'')}
function showPayment(pid,i){readSTM();const p=P(pid),x=pays(p)[i-1];closeSheet();docOpen('كشف الدفعة '+ordN(i),payDoc(p,x,STM.annex),{no:`د-${stNo(p)}-${i}`,who:whoOf(p),client:cliSig(p)})}
const whoOf=p=>((C(p.cid)||{}).name||'')+' · '+p.name;
const cliSig=p=>{const c=C(p.cid)||{};return c.name?((c.title?c.title+' ':'')+c.name):''};
function readSTM(){const a=$('#st-annex');if(a)STM.annex=a.checked}

/* كشف نهائي مختصر بالدفعات */
function showFinal(pid){readSTM();const annex=STM.annex;const p=P(pid),c=C(p.cid)||{},k=calc(p),L=pays(p);closeSheet();
  const dates=k.es.map(e=>e.date);const neg=k.bal<0;

     <div><span class="m">عدد الدفعات:</span> <b>${L.length}</b> · <span class="m">عدد المصروفات:</span> <b>${k.es.length-L.length}</b></div>
     <div><span class="m">الأتعاب:</span> <b>${esc(feeLabel(p))}</b> · <span class="m">المهندس:</span> <b>${esc(S.me)}</b></div>`)}
   ${stKpis([['مجموع المقبوض',k.inn],['مجموع المصروف',k.out],['أتعاب المهندس',k.fee],[neg?'مطلوب من الزبون':'الرصيد للزبون',k.bal,neg?'negb':'']])}

    ${p.feeType==='fixed'?`<tr><td colspan="4">أتعاب المهندس المقطوعة</td><td class="n"></td><td></td><td class="n r"><b>−${fmt(k.fee)}</b></td></tr>`:''}
    <tr class="tot"><td colspan="3">المجموع</td><td class="n">${fmt(k.inn)}</td>${p.feeType==='pct'?`<td class="n">${fmt(k.fee)}</td>`:''}<td class="n">${fmt(k.out)}</td><td class="n">${k.es.length-L.length}</td><td class="n">${sfmt(k.bal)}</td></tr></tbody></table>
   <div class="st-2" style="grid-template-columns:1fr 1.2fr"><div><div class="st-h3">أين صُرف المبلغ</div>${stDonut(k.byCat,k.out)}</div>

  if(annex)for(const x of L)html+=`<div class="pgbrk"></div>`+payDoc(p,x,false);

/* كشف حسب فترة */
function showPeriod(pid,from,to){readSTM();if(!okDate(from)||!okDate(to))return toast('التاريخ بالأرقام هكذا: 2026-11-19');
  const p=P(pid),c=C(p.cid)||{},es=entriesOf(pid);const pct=p.feeType==='pct'?(+p.feeVal||0)/100:0;closeSheet();
  let open=0;for(const e of es)if(e.date<from)open+=e.kind==='in'?e.amt-Math.round(e.amt*pct):-e.amt;
  const r=es.filter(e=>e.date>=from&&e.date<=to),ins=r.filter(e=>e.kind==='in'),outs=r.filter(e=>e.kind==='out');

<script>

const normPhone=p=>{let d=String(p||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'');
  if(d.startsWith('00964'))d=d.slice(5);else if(d.startsWith('964'))d=d.slice(3);if(d.startsWith('0'))d=d.slice(1);return /^7\d{9}$/.test(d)?d:''};

    if(c&&c.S&&c.S.v===1&&c.org===ME.org){S=c.S;BASE=c.BASE||BASE;SINCE=c.SINCE||{}}else{S=emptyS();BASE={clients:{},projects:{},entries:{},co:''};SINCE={}}

  try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}if(!S||S.v!==1)S=demo()};

function schedPush(){clearTimeout(SYNC.t);SYNC.t=setTimeout(push,350)}
function dirty(){const out={};for(const t in TBL){out[t]=S[t].filter(r=>J(r)!==BASE[t][r.id])}
  out.co=CAN.admin&&J(S.co)!==BASE.co;return out}

async function push(){if(MODE!=='cloud')return;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;let bad=false,denied=false;
  try{const d=dirty();
    for(const t in TBL){if(!d[t].length)continue;const sent={};
      const rows=d[t].map(r=>{const s=J(r);sent[r.id]=s;return{org_id:ME.org,id:r.id,data:r}});
      for(let i=0;i<rows.length;i+=200){const part=rows.slice(i,i+200);
        const{data,error}=await SB.from(TBL[t]).upsert(part,{onConflict:'org_id,id'}).select('id,data,updated_at');
        if(error){bad=true;if(/project limit/i.test(error.message)){SYNC.lim=true;denied=true}else if(error.code==='42501'||/not allowed|only the owner|row-level/i.test(error.message))denied=true;continue}
        for(const row of data){const loc=S[t].find(r=>r.id===row.id);
          if(!loc){BASE[t][row.id]=J(row.data);continue}
          const same=J(loc)===sent[row.id];

async function pageAll(q){const out=[];for(let from=0;;from+=1000){const{data,error}=await q().range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function pull(force){if(MODE!=='cloud')return false;
  try{const{data:org,error:oe}=await SB.from('asas_orgs').select('co,created_at,trial_until,paid_until,plan,extra_eng').eq('id',ME.org).single();if(oe)throw oe;

    const until=[org.trial_until,org.paid_until].filter(Boolean).sort().pop();const was=subEnded();S.sub={until,paid:!!org.paid_until&&org.paid_until>=org.trial_until,plan:org.plan||'',xe:org.extra_eng||0};setCan();if(was!==subEnded())render();
    let changed=false;
    for(const t in TBL){const since=force?null:SINCE[t];
      const rows=await pageAll(()=>{let q=SB.from(TBL[t]).select('id,data,updated_at').eq('org_id',ME.org).order('updated_at').order('id');return since?q.gte('updated_at',since):q});
      for(const row of rows){const i=S[t].findIndex(r=>r.id===row.id);const loc=i>=0?S[t][i]:null;
        const localDirty=loc&&J(loc)!==BASE[t][row.id];

        if(!loc)S[t].push(row.data);else if(J(loc)!==J(row.data))S[t][i]=row.data;else continue;

    SYNC.st=pendingCount()?SYNC.st:'ok';
    try{localStorage.setItem(cacheKey(),J({org:ME.org,ME,S,BASE,SINCE}))}catch(e){}
    syncBadge();return changed}
  catch(e){SYNC.st=navigator.onLine===false?'off':'err';syncBadge();return false}}
function idle(){return !$('#layer').innerHTML&&V.v!=='entry'&&!document.body.classList.contains('docopen')}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});

function invCopy(){const t=$('#inv-t');const done=()=>toast('نُسخت الرسالة ✓');
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(done).catch(()=>{try{t.removeAttribute('readonly');t.select();document.execCommand('copy');t.setAttribute('readonly','');done()}catch(e){t.select();toast('حدّد النص وانسخه')}})}

  const P={'فرد':[30000,55000,100000],'فريق':[65000,120000,220000],'مكتب':[135000,250000,450000]};
  sheet(`<h3>${esc(o.name)}</h3><p class="note" style="margin:0">${esc(o.owner)} · <span class="num">${esc(o.phone)}</span> · سجّل <span class="num">${o.created_at.slice(0,10)}</span></p>
   <div class="trialbar ${c==='r'?'end':''}"><span>${st} · ينتهي <span class="num">${u.slice(0,10)}</span></span></div>
   <div class="stopt"><b>تفعيل اشتراك</b>
    <div class="cats" id="adm-plan">${Object.keys(P).map((k,i)=>`<button class="${(o.plan||'فرد')===k?'on':''}" data-k="${k}" onclick="admPick(this,'plan')">${k}</button>`).join('')}</div>
    <div class="cats" id="adm-months">${[[3,'3 أشهر'],[6,'6 أشهر'],[12,'سنة']].map(([m,t])=>`<button class="${m===12?'on':''}" data-k="${m}" onclick="admPick(this,'months')">${t}</button>`).join('')}</div>

    <div class="cats" id="adm-method">${['ماستر كارد'].map((m,i)=>`<button class="${i===0?'on':''}" data-k="${m}" onclick="admPick(this,'method')">${m}</button>`).join('')}</div>
    <div class="fld" style="box-shadow:none;background:var(--soft)"><div class="bx"><label for="adm-rc">رقم الوصل أو ملاحظة (اختياري)</label><input id="adm-rc" class="num" style="text-align:right"></div></div>
    <div class="note" id="adm-sum" style="margin:0;font-size:14px"></div>
    <button class="btn y" onclick="admActivate('${id}')">✓ تفعيل الاشتراك</button></div>
   ${o.payments.length?`<div class="stopt"><b>آخر الدفعات</b>${o.payments.map(p=>`<div class="s" style="font-size:13px">${esc(p.plan)} · ${p.months} أشهر · <span class="num">${fmt(p.amount)}</span> د.ع · ${esc(p.method||'')} ${p.receipt?'· '+esc(p.receipt):''} ${p.extra_eng?' · +'+p.extra_eng+' مهندس':''} · حتى <span class="num">${p.to_date.slice(0,10)}</span></div>`).join('')}</div>`:''}
   <a class="btn ghost" style="text-decoration:none" href="https://wa.me/964${esc(String(o.phone).replace(/^0/,''))}" target="_blank" rel="noopener">💬 مراسلة عبر الواتساب</a>
   <button class="btn ghost" onclick="closeSheet()">إغلاق</button>`);admSum()}
function admX(d){const i=$('#adm-x');const v=Math.max(0,Math.min(50,(parseInt(i.value)||0)+d));i.value=v;$('#adm-xv').textContent=v;admSum()}
function admPick(b,k){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));admSum()}
function admVal(id){const b=$('#'+id+' button.on');return b&&b.dataset.k}
function admSum(){const P={'فرد':{3:30000,6:55000,12:100000},'فريق':{3:65000,6:120000,12:220000},'مكتب':{3:135000,6:250000,12:450000}};const A={3:25000,6:45000,12:80000};const el=$('#adm-sum');if(!el)return;
  const pl=admVal('adm-plan'),mo=admVal('adm-months'),w=$('#adm-xwrap');if(w)w.style.display=pl==='مكتب'?'flex':'none';
  const x=pl==='مكتب'?Math.max(0,Math.min(50,parseInt($('#adm-x').value)||0)):0;
  el.innerHTML=`المبلغ: <b class="num">${fmt(P[pl][mo]+x*A[mo])}</b> د.ع${x?` (الباقة <span class="num">${fmt(P[pl][mo])}</span> + <span class="num">${x}</span> مهندس إضافي <span class="num">${fmt(x*A[mo])}</span>)`:''}${pl==='مكتب'?` · المهندسون: <b class="num">${5+x}</b>`:''}<br>تبدأ المدة من نهاية مدته الحالية`}
async function admActivate(id){const body={action:'activate',org_id:id,plan:admVal('adm-plan'),months:+admVal('adm-months'),method:admVal('adm-method'),receipt:$('#adm-rc').value.trim(),extra_eng:admVal('adm-plan')==='مكتب'?(parseInt($('#adm-x').value)||0):0};
  const{data,error}=await SB.functions.invoke('asas-admin',{body});if(error){let m='تعذّر التفعيل';try{const j=await error.context.json();if(j.msg)m=j.msg}catch(e){}return toast(m)}
  closeSheet();toast('تم التفعيل حتى '+data.paid_until.slice(0,10)+' ✓');ADM.orgs=null;render()}

async function boot(){const h=location.hash.slice(1);
  if(HAS_CLOUD){SB=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'asas-auth'}});
    const{data:{session}}=await SB.auth.getSession();
    if(session){
      await enterCloud()}
    else{let m=null;try{m=localStorage.getItem('asas_mode')}catch(e){}if(m==='demo'){MODE='demo';load();setCan();render()}else{go('login')}}
    SB.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&MODE==='cloud'){MODE='demo';ME=null;setCan();go('login')}})}
  else{load();save();setCan();render()}
  if(h.startsWith('st-'))showStatement(h.slice(3));else if(h==='cashbook')showCashbook('2026-06-01',today());
  else if(h.startsWith('v-')){const[v,a]=h.slice(2).split('-');V={v,a:a&&(v==='entry'?{id:S.entries.find(e=>e.pid===a)?.id}:a)};render()}}
boot();
