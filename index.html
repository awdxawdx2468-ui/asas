<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-180.png?v=3">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="أسس">
<meta name="application-name" content="أسس">
<meta name="description" content="حسابات مشاريعك وزبائنك بمكان واحد">
<title>أسس</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: phone-first single column app, navy header band, white cards, bottom tab bar with yellow centre button */
:root{
  --navy:#14294A; --navy2:#1E3A66; --yel:#F5B800; --yeld:#E0A200; --cream:#FFF6DA;
  --green:#169C55; --greenbg:#E3F5EA; --red:#E04848; --redbg:#FCE8E8;
  --bg:#EEF2F8; --card:#FFFFFF; --ink:#14294A; --mut:#7A879C; --line:#E3E8F0; --soft:#F3F6FA;
  --c-mat:#14294A; --c-lab:#4F6D99; --c-eq:#E0A200; --c-tr:#C3CCDA; --c-oth:#9AA5B8;
  --f:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif; --f-cal:'Aref Ruqaa','Tajawal',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);direction:rtl;margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num,.amt{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative}
.top{background:var(--navy);color:#fff;padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.top.short{padding-bottom:22px}
.top::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.05);left:-70px;top:-90px}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.logo{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;font-size:20px;font-weight:800;line-height:1.25}
.brand p{margin:2px 0 0;font-size:13px;opacity:.75}
.ib{width:44px;height:44px;border-radius:13px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;margin-inline-start:auto;flex:none}
.ib svg{width:21px;height:21px}
.wrap{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.pull{margin-top:-52px;position:relative}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 6px 22px rgba(20,41,74,.07)}
.cash .lbl{color:var(--mut);font-size:14px}
.cash .big{font-size:38px;font-weight:800;margin:6px 0 14px;display:flex;align-items:baseline;gap:8px;justify-content:flex-start}
.cash .big small{font-size:15px;color:var(--mut);font-weight:500}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--soft);border-radius:14px;padding:10px 12px}
.mini span{display:block;font-size:12.5px;color:var(--mut)}
.mini b{font-size:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border:0;border-radius:18px;padding:16px;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.act i{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:20px}
.act.in{background:linear-gradient(135deg,#1DB45F,#128A4A)}
.act.out{background:linear-gradient(135deg,#F06262,#D63C3C)}
.sec{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.sec h2{font-size:18px;margin:0;font-weight:800}
.link{color:var(--yeld);font-weight:700;background:none;border:0;padding:4px}
.prj{background:var(--card);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;border:0;width:100%;text-align:right;box-shadow:0 4px 14px rgba(20,41,74,.05)}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.av.g{background:var(--greenbg);color:var(--green)}.av.r{background:var(--redbg);color:var(--red)}.av.y{background:var(--cream);color:var(--yeld)}
.prj .mid{flex:1;min-width:0}
.prj .nm{font-weight:800;font-size:16.5px}
.prj .sub{color:var(--mut);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;margin-inline-start:auto}
.prj .bal{text-align:left;flex:none}
.prj .bal b{font-size:16.5px;display:block}
.prj .bal span{font-size:12px;color:var(--mut)}
.pos{color:var(--green)}.neg{color:var(--red)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--cream);color:#8a6400}
.chip.g{background:var(--greenbg);color:var(--green)}.chip.r{background:var(--redbg);color:var(--red)}.chip.n{background:#E7ECF4;color:var(--navy)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -6px 20px rgba(20,41,74,.08);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;padding:6px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--navy);font-weight:800}
.fab{width:62px;height:62px;border-radius:20px;background:var(--yel);border:0;color:var(--navy);font-size:34px;font-weight:700;margin:-30px auto 2px;display:grid;place-items:center;box-shadow:0 8px 18px rgba(224,162,0,.45)}
.fabw{display:flex;flex-direction:column;align-items:center;font-size:12.5px;color:var(--mut)}
/* statements chooser + payment doc */
.stopt{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sth b{font-size:16px}.sth p{margin:4px 0 0;font-size:13px;color:var(--mut);line-height:1.6}
.ck2{display:flex;gap:8px;align-items:center;font-size:14px}.ck2 input{width:20px;height:20px}
.eq{background:#EEF2F8;border-radius:12px;padding:6px 14px;font-size:12px}
.eq div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #D3DAE6}
.eq div:last-child{border:0}.eq b{font-variant-numeric:tabular-nums;direction:ltr}
.eq .eqt{font-weight:800;font-size:13.5px}
.st-fin.negf{background:#8E1F1F}
.pgbrk{break-before:page;page-break-before:always;height:0}
@media screen{.pgbrk{height:18px;background:#5d6b80;margin:0}}
table.t.dense{font-size:9.6px}table.t.dense td{padding:1.5px 6px;line-height:1.3}table.t.dense th{padding:3px 6px}
table.t.dense .cat{font-size:8.5px;padding:0 5px;line-height:1.4}
.ax-h{background:var(--navy);color:#fff;padding:10px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--yeld);font-size:11px}
.ax-h b{font-size:14px}
/* clients */
.hint{background:#E7ECF4;border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.7;color:var(--navy)}
.ccard{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(20,41,74,.06);display:flex;flex-direction:column;gap:8px}
.chead{display:flex;align-items:center;gap:12px}
.chead .mid{flex:1;min-width:0}.chead .cn{font-weight:800;font-size:18px}.chead .s{font-size:12.5px;color:var(--mut)}
.chead .chip{border:0}
.plabel{font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.plist{border-inline-start:3px solid var(--yel);margin-inline-start:22px;padding-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--soft);border:0;border-radius:14px;padding:10px 12px;width:100%;text-align:right}
.pitem .pic{font-size:18px}.pitem .mid{flex:1;min-width:0}.pitem .t{font-weight:800}.pitem .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pb{text-align:left;flex:none}.pitem .pb b{display:block}.pitem .pb span{font-size:11.5px;color:var(--mut)}
.addp{border:1.5px dashed #CBD4E1;background:none;border-radius:12px;padding:8px;color:var(--navy);font-weight:700}
.ctot{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px}
/* forms */
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.1);border-radius:16px;padding:5px;margin-top:18px;position:relative}
.seg button{border:0;background:none;color:#fff;padding:12px;border-radius:12px;font-weight:800;font-size:18px;opacity:.85}
.seg .on.in{background:var(--green);opacity:1}.seg .on.out{background:var(--red);opacity:1}
.amtcard{text-align:center;padding:16px}
.amtcard label{color:var(--mut);font-size:14px}
.amtcard input{width:100%;border:0;text-align:center;font-size:40px;font-weight:800;outline:none;background:none;direction:ltr}
.amtcard .w{color:var(--mut);font-size:13.5px;min-height:20px}
.fld{background:var(--card);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 10px rgba(20,41,74,.04)}
.fld .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:19px}
.fld .bx{flex:1;min-width:0;display:flex;flex-direction:column}
.fld label{font-size:12.5px;color:var(--mut)}
.fld input,.fld select,.fld textarea{border:0;outline:none;background:none;font-weight:700;font-size:16.5px;padding:3px 0;width:100%}
.fld select{appearance:none;-webkit-appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:3px 10px;font-size:12.5px;color:var(--navy)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-weight:700;font-size:13.5px;color:var(--mut)}
.cats button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.photo{border:2px dashed #CBD4E1;border-radius:16px;padding:14px;text-align:center;color:var(--mut);background:#fff;display:block}
.photo img{max-height:120px;border-radius:10px;display:block;margin:0 auto 6px}
.btn{border:0;border-radius:16px;padding:16px;font-weight:800;font-size:18px;width:100%;background:var(--navy);color:#fff;display:flex;justify-content:center;gap:8px;align-items:center}
.btn.y{background:var(--yel);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px;width:auto}
.btn.del{background:#fff;color:var(--red);border:1.5px solid #F5C9C9}
.btn .ck{color:var(--yel)}
.hdr{display:flex;align-items:center;gap:12px;position:relative}
.hdr h1{margin:0;font-size:21px;font-weight:800}
.hdr p{margin:2px 0 0;font-size:13px;opacity:.75}
.back{width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;flex:none;margin-inline-start:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(20,41,74,.05)}
.kpi span{font-size:12.5px;color:var(--mut);display:block}
.kpi b{font-size:18px}
.kpi.hi{background:var(--yeld);color:var(--navy)}.kpi.hi span{color:var(--navy);opacity:.8}
.kpi.lo{background:var(--red);color:#fff}.kpi.lo span{color:#fff;opacity:.85}
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 12px rgba(20,41,74,.05)}
.li{display:flex;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:right}
.li:last-child{border-bottom:0}
.li .dt{font-size:12px;color:var(--mut)}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .a{font-weight:800;flex:none}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800}
.dot.in{background:var(--greenbg);color:var(--green)}.dot.out{background:var(--redbg);color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.trial{background:var(--cream);color:#7a5800;border-radius:14px;padding:10px 14px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.menu .li .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.note{font-size:12.5px;color:var(--mut);line-height:1.6}
.log{font-size:12.5px;color:var(--mut);background:var(--soft);border-radius:12px;padding:10px 12px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.log div:last-child{border:0}
details summary{cursor:pointer;font-weight:700;color:var(--navy);padding:6px 0}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:19px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;z-index:60;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:90%}
/* document view */
#doc{display:none;position:fixed;inset:0;background:#5d6b80;z-index:40;overflow:auto}
#doc.show{display:block}
.docbar{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.docbar b{flex:1;font-size:16px}
.docbar button{border:0;border-radius:11px;padding:9px 14px;font-weight:800;background:rgba(255,255,255,.12);color:#fff}
.docbar button.y{background:var(--yel);color:var(--navy)}
.paperwrap{padding:16px 0 40px;display:flex;justify-content:center}
.paper{width:794px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);color:#1b2a44;font-size:13px;flex:none}
/* statement styles */
.st-h{background:var(--navy);color:#fff;padding:28px 34px 24px;display:flex;align-items:center;gap:20px;border-bottom:7px solid var(--yeld)}
.st-logo{width:96px;height:96px;border-radius:20px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.st-logo img{width:100%;height:100%;object-fit:contain}
.st-co{flex:1}
.st-co .en{font-family:var(--f-cal);font-size:34px;line-height:1.2}
.st-co .cn{color:var(--yeld);font-weight:800;font-size:17px;letter-spacing:.3px;margin-top:2px}
.st-co .ad{font-size:12.5px;opacity:.75;margin-top:6px}
.st-tt{text-align:left}
.st-tt h1{margin:0;font-size:30px;font-weight:800;padding-bottom:8px;border-bottom:4px solid var(--yeld);display:inline-block}
.st-tt div{font-size:12.5px;opacity:.75;margin-top:10px}
.st-b{padding:22px 34px 0}
.st-info{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.st-box{background:#EEF2F8;border-radius:14px;padding:14px 16px;line-height:1.85}
.st-box h4{margin:0 0 2px;font-size:13.5px}
.st-box .big{font-size:20px;font-weight:800}
.st-box .m{color:#6b7891}
.st-k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.st-k div{border:1.5px solid #E1E7F0;border-radius:14px;padding:12px 14px;border-left:5px solid var(--navy)}
.st-k div:nth-child(2){border-left-color:var(--red)}
.st-k div:nth-child(3){border-left-color:var(--yeld)}
.st-k div:last-child{background:var(--yeld);border-color:var(--yeld)}
.st-k div.negb{background:var(--red);border-color:var(--red);color:#fff}
.st-k span{display:block;color:#6b7891;font-size:12.5px}
.st-k div:last-child span{color:var(--navy)}
.st-k div.ein{border-left-color:var(--green)}.st-k div.eout{border-left-color:var(--red)}.st-k div.efee{border-left-color:var(--yeld)}.st-k div.eprev{border-left-color:var(--navy)}
.st-k div.negb,.st-k div.negb:last-child{background:var(--red);border-color:var(--red);color:#fff}.st-k div.negb span{color:#fff}
.st-k div.negb span{color:#fff}
.st-k b{font-size:19px;font-variant-numeric:tabular-nums}
.st-k small{font-size:11px;font-weight:500;margin-inline-start:3px}
.st-h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:16px 0 8px}
.st-h3::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--yeld)}
.st-2{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.t th{background:var(--navy);color:#fff;font-weight:700;padding:8px 10px;text-align:right}
table.t th:first-child{border-radius:0 10px 10px 0}
table.t th:last-child{border-radius:10px 0 0 10px}
table.t td{padding:7px 10px;border-bottom:1px solid #E6EBF2}
table.t tbody tr:nth-child(even) td{background:#F6F8FB}
table.t .n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
table.t tr.tot td{background:var(--cream)!important;font-weight:800;border:0}
table.t tr.tot td:first-child{border-radius:0 10px 10px 0}
table.t tr.tot td:last-child{border-radius:10px 0 0 10px}
table.t thead{display:table-header-group}
table.t tr{break-inside:avoid}
.g{color:var(--green)}.r{color:var(--red)}.mut{color:#7d8aa1}
.cat{display:inline-block;padding:1px 9px;border-radius:9px;font-size:11.5px;font-weight:800;background:var(--cream);color:#7a5800}
.donut{display:flex;align-items:center;gap:16px}
.leg{flex:1;font-size:12.5px}
.leg div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #DCE2EC}
.leg i{width:12px;height:12px;border-radius:4px;flex:none}
.leg b{margin-inline-start:auto;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums;direction:ltr}
.st-fin{background:var(--navy);color:#fff;border-radius:16px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px;break-inside:avoid}
.st-fin h3{margin:0;font-size:18px}

function readF(){const g=id=>{const el=$('#'+id);return el?el.value:undefined};
  F.amt=parseAmt(g('f-amt'));F.pid=g('f-pid');F.det=g('f-det').trim();F.party=g('f-party').trim();F.date=g('f-date').trim();
  F.docType=g('f-dt');F.docNo=g('f-dn').trim();F.src=g('f-src');F.note=g('f-note').trim();if($('#f-rcv'))F.rcv=g('f-rcv').trim();
  if($('#f-mat')){F.mat=g('f-mat').trim();F.qty=g('f-qty').trim();F.unit=g('f-unit').trim()}}
function entryBind(){const a=$('#f-amt');if(!a)return;
  a.addEventListener('input',()=>{const n=parseAmt(a.value);a.value=n?fmt(n):'';$('#f-words').textContent=n?words(n)+' دينار':'اكتب المبلغ بالدينار'});
  const d=$('#f-det');if(d&&F.kind==='out')d.addEventListener('input',()=>{if(!F.catSet){F.cat=d.value?autoCat(d.value):'';paintCat()}});
  document.querySelectorAll('.wrap input').forEach(el=>el.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();if(ev.ctrlKey||ev.metaKey)return entrySave();
    const all=[...document.querySelectorAll('.wrap input:not([type=file]),.wrap select')];const i=all.indexOf(el);if(all[i+1])all[i+1].focus()}}));
  if(!F.id&&!F.amt)setTimeout(()=>a.focus(),50)}
function paintCat(){const ch=$('#f-catchip');if(ch)ch.textContent=F.cat?CATN[F.cat]:'—';
  document.querySelectorAll('#f-cats button').forEach(b=>b.classList.toggle('on',b.dataset.k===F.cat));const mr=$('#f-matrow');if(mr)mr.hidden=F.cat!=='mat'}

function setKind(k){readF();F.kind=k;render()}
function setDate(back){const d=new Date();d.setDate(d.getDate()-back);dpkPut('f-date',today(d))}
function attPick(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const sc=Math.min(1,1000/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=im.width*sc;cv.height=im.height*sc;
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);readF();F.att=cv.toDataURL('image/jpeg',.7);render()};im.src=r.result};r.readAsDataURL(f)}
const FIELDN={amt:'المبلغ',date:'التاريخ',det:'البيان',party:'الطرف',pid:'المشروع',cat:'البند',docNo:'رقم المستند',docType:'نوع المستند',kind:'النوع'};
function entrySave(){if(!F.quick)readF();if(F.id&&!canEditE(S.entries.find(e=>e.id===F.id)))return toast(LOCK_MSG);
  if(!F.amt)return toast('اكتب المبلغ');if(!okDate(F.date))return toast('اختر التاريخ');if(F.date>today())return toast('لا يمكن اختيار تاريخ بعد اليوم');if(!F.pid)return toast('اختر المشروع');
  if(F.pid==='office')F.cat='';else if(F.kind==='out'&&!F.cat)F.cat=autoCat(F.det);if(F.kind==='in')F.cat='';
  const doSave=()=>{if(F.id){const i=S.entries.findIndex(e=>e.id===F.id);const old=S.entries[i];const ch=[];
      for(const k of Object.keys(FIELDN))if(String(old[k]??'')!==String(F[k]??''))ch.push(`${FIELDN[k]}: ${k==='amt'?fmt(old[k]):k==='cat'?CATN[old[k]]||'':k==='pid'?(P(old[k])||{}).name:old[k]||'—'} ← ${k==='amt'?fmt(F[k]):k==='cat'?CATN[F[k]]||'':k==='pid'?(P(F[k])||{}).name:F[k]||'—'}`);
      const rec=Object.assign({},old,F);delete rec.catSet;delete rec.quick;
      if(old.kind!==F.kind)rec.no=nextNo(F.kind);
      if(ch.length)rec.log=[...(old.log||[]),{at:new Date().toISOString().slice(0,16).replace('T',' '),by:S.me,ch:ch.join(' · ')}];
      S.entries[i]=rec}
    else{const rec=Object.assign({},F,{id:uid(),no:nextNo(F.kind),ts:Date.now(),by:S.me,log:[]});if(NOFIX)rec.nf=1;if(AS)rec.cu=AS.uid;delete rec.catSet;delete rec.quick;S.entries.push(rec)}
    const nid=F.id||S.entries[S.entries.length-1].id,wasIn=F.kind==='in',isNew=!F.id;save();toast(isOff()?'✓ حُفظ على جهازك ⏳ ويُرفع إلى السيرفر فور عودة الاتصال':'تم حفظ المبلغ ✓ على '+pgName(F.pid).replace(/&amp;/g,'&'));(F.pid==='office'?go(AS?'home':'net'):go('project',F.pid));if(wasIn&&isNew)setTimeout(()=>rcptSheet(nid,true),250)};
  // كشف التكرار
  const dup=!F.id&&live(S.entries).find(e=>e.pid===F.pid&&e.kind===F.kind&&e.date===F.date&&e.amt===F.amt&&(e.det===F.det||(!F.det&&e.party===F.party)));
  if(dup)return ask('يوجد مبلغ مسجّل بنفس التاريخ والمبلغ والبيان. هل هذا تكرار؟','احفظه على أي حال',doSave);
  doSave()}
function entryDel(){ask('نقل هذا المبلغ إلى سلة المحذوفات؟ يمكنك استرجاعه لاحقاً.','نقل للسلة',()=>{const e=S.entries.find(x=>x.id===F.id);e.del={at:today(),by:S.me};

let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function clientSheet(id){const c=id?C(id):{name:'',title:'السيد',phone:''};
  sheet(`<h3>${id?'تعديل زبون':'زبون جديد'}</h3>
   <div class="row3" style="grid-template-columns:1fr 2.5fr"><div class="fld"><div class="bx"><label for="c-title">اللقب</label><input id="c-title" value="${esc(c.title)}"></div></div>
   <div class="fld"><div class="bx"><label for="c-name">اسم الزبون</label><input id="c-name" value="${esc(c.name)}" placeholder="حسين عبد الله"></div></div></div>
   <div class="fld"><div class="bx"><label for="c-phone">رقم الموبايل (للواتساب)</label><input id="c-phone" class="num" inputmode="tel" value="${esc(c.phone)}" placeholder="07xx xxx xxxx" style="text-align:right"></div></div>
   <button class="btn" onclick="clientSave('${id||''}')"><span class="ck">✓</span> حفظ ${id?'':'ثم أضف مشروعه'}</button>
   ${id?`<button class="btn del" onclick="clientDel('${id}')">🗑️ حذف الزبون</button>`:''}`);setTimeout(()=>$('#c-name').focus(),50)}
function clientSave(id){const n=$('#c-name').value.trim();if(!n)return toast('اكتب اسم الزبون');const d={name:n,title:$('#c-title').value.trim(),phone:$('#c-phone').value.trim()};
  if(id){Object.assign(C(id),d);save();closeSheet();render()}else{const c=Object.assign({id:uid()},d);S.clients.push(c);save();projectSheet(null,c.id)}}
function clientDel(id){if(live(S.projects).some(p=>p.cid===id))return toast('انقل مشاريع هذا الزبون إلى السلة أولاً');C(id).del={at:today(),by:S.me};save();closeSheet();render()}
function projectSheet(id,cid){if(!id&&projFull())return limitSheet();const p=id?P(id):{cid:cid||(live(S.clients)[0]||{}).id,name:'',desc:'',loc:'',feeType:'pct',feeVal:10,start:today()};
  if(!live(S.clients).length)return clientSheet();
  sheet(`<h3>${id?'تعديل مشروع':'مشروع جديد'}</h3>
   <div class="fld"><div class="bx"><label for="p-cid">الزبون</label><select id="p-cid">${live(S.clients).map(c=>`<option value="${c.id}" ${c.id===p.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
   <div class="fld"><div class="bx"><label for="p-name">اسم المشروع</label><input id="p-name" value="${esc(p.name)}" placeholder="بيت سكني"></div></div>
   <div class="fld"><div class="bx"><label for="p-desc">وصف مختصر</label><input id="p-desc" value="${esc(p.desc)}" placeholder="250 م² · طابقان"></div></div>
   <div class="fld"><div class="bx"><label for="p-loc">الموقع</label><input id="p-loc" value="${esc(p.loc)}" placeholder="الديوانية، حي العسكري"></div></div>
   <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:8px"><b>أتعاب المهندس لهذا المشروع</b>
    <div class="cats"><button id="ft-pct" class="${p.feeType==='pct'?'on':''}" onclick="feeT('pct')">نسبة من المقبوض</button><button id="ft-fixed" class="${p.feeType==='fixed'?'on':''}" onclick="feeT('fixed')">مبلغ مقطوع</button></div>
    <div class="fld" style="box-shadow:none;background:var(--soft)"><div class="bx"><label for="p-fee" id="p-feel">${p.feeType==='pct'?'النسبة %':'المبلغ (د.ع)'}</label><input id="p-fee" inputmode="numeric" class="num" style="text-align:right" value="${p.feeType==='pct'?p.feeVal:fmt(p.feeVal)}"></div></div>
    <input type="hidden" id="p-ft" value="${p.feeType}"></div>
   <button class="btn" onclick="projectSave('${id||''}')"><span class="ck">✓</span> حفظ المشروع</button>
   ${id?(p.done?`<button class="btn ghost" onclick="projectDone('${id}',false)">إعادة فتح المشروع</button>`:`<button class="btn ghost" onclick="projectDone('${id}',true)">✔ إنهاء المشروع (لا يُحسب ضمن حد الباقة)</button>`):''}
   ${id?`<button class="btn del" onclick="projectDel('${id}')">🗑️ حذف المشروع</button>`:''}`)}
function feeT(t){$('#p-ft').value=t;$('#ft-pct').classList.toggle('on',t==='pct');$('#ft-fixed').classList.toggle('on',t==='fixed');$('#p-feel').textContent=t==='pct'?'النسبة %':'المبلغ (د.ع)';$('#p-fee').value=t==='pct'?10:''}
function projectSave(id){const n=$('#p-name').value.trim();if(!n)return toast('اكتب اسم المشروع');const ft=$('#p-ft').value;
  const d={cid:$('#p-cid').value,name:n,desc:$('#p-desc').value.trim(),loc:$('#p-loc').value.trim(),feeType:ft,feeVal:ft==='pct'?+$('#p-fee').value.replace(/[^\d.]/g,'')||0:parseAmt($('#p-fee').value)};
  if(id){Object.assign(P(id),d);save();closeSheet();render()}else{const p=Object.assign({id:uid(),start:today()},d);S.projects.push(p);save();closeSheet();go('project',p.id)}}
function projectDel(id){P(id).del={at:today(),by:S.me};save();closeSheet();go('home')}
function backupSheet(){sheet(`<h3>النسخ الاحتياطي</h3><p class="note">في هذه النسخة التجريبية تُحفظ البيانات في متصفحك فقط. انسخ النص أدناه واحفظه، أو الصق نسخة سابقة لاستيرادها. مع ربط السحابة ستُؤخذ نسخة يومية تلقائياً لكل مهندس.</p>
  <textarea id="bk" style="width:100%;height:150px;border-radius:12px;border:1px solid var(--line);padding:10px;direction:ltr;font-size:11px">${esc(JSON.stringify(S))}</textarea>
  <div class="row2"><button class="btn sm" style="width:100%" onclick="const t=$('#bk');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('نُسخ ✓')).catch(()=>toast('حدّد النص وانسخه'))">نسخ</button>
  <button class="btn sm ghost" style="width:100%" onclick="try{const x=JSON.parse($('#bk').value);if(x.v!==1)throw 0;S=x;save();closeSheet();go('home');toast('تم الاستيراد ✓')}catch(e){toast('النص غير صالح')}">استيراد</button></div>`)}
function subSheet(){sheet(`<h3>اشتراك أسس</h3><div class="hook in">مبلغٌ واحد تنسى تسجيله قد يكلّفك أكثر من اشتراك سنة كاملة.<br><b>أسس يحفظ لك كل دينار.</b></div><p class="note">الأسعار بالدينار العراقي · الدفع بتحويل ماستر كارد إلى الرقم <b class="num">${PLATFORM.phone}</b></p>
  <div class="list">${PLANS.map(([n,d,a,b,c])=>`<div class="li"><div class="mid"><div class="t">${n}</div><div class="s" style="white-space:normal">${d.split(' · ')[0]}</div><div class="s" style="white-space:normal;font-weight:700;color:var(--ink,#13294b)">📁 ${d.split(' · ')[1]||''}</div>${n==='مكتب'?'<div class="s" style="white-space:normal;font-size:12px">➕ مهندس إضافي: '+addonTxt()+'</div>':''}</div><div style="text-align:left;font-size:12.5px;line-height:1.6"><div>3 أشهر <b class="num">${pfmt(a)}</b></div><div>6 أشهر <b class="num">${pfmt(b)}</b></div><div>سنة <b class="num">${pfmt(c)}</b></div></div></div>`).join('')}</div>
  <button class="btn ghost" onclick="closeSheet()">إغلاق</button>`)}


/* ===== وصل الاستلام + الواتساب للزبون ===== */
function waNum(ph){let d=String(ph||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('964'))return d;if(d.startsWith('0'))d=d.slice(1);return d.length>=9?'964'+d:''}
function waOpen(c,text){const n=waNum(c&&c.phone);if(!n){toast('أضف رقم موبايل الزبون أولاً');if(c&&c.id)setTimeout(()=>clientSheet(c.id),300);return}
  const a=document.createElement('a');a.href='https://wa.me/'+n+(text?'?text='+encodeURIComponent(text):'');a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function cName(c){return (c.title?c.title+' ':'')+(c.name||'')}
function waSign(){const c=S.co;const e=c.eng?(/^م(\.\s*|\s+)/.test(c.eng)?c.eng:'م. '+c.eng):'';const bare=x=>String(x||'').trim().replace(/^م(\.\s*|\s+)/,'').trim();const n=c.name&&bare(c.name)!==bare(e)?c.name:'';return [e,n].filter(Boolean).join(' · ')}
function coSign(){const c=S.co;const e=c.eng?(/^م\.?\s/.test(c.eng)?c.eng:'م. '+c.eng):'';const bare=x=>String(x||'').trim().replace(/^م(\.\s*|\s+)/,'').trim();const n=c.name&&bare(c.name)!==bare(e)?c.name:'';return [...new Set([e,n,c.phone||''].filter(Boolean))].join(' · ')}
function waRow(c,p,ps){if(!c||!c.id)return '';const lastIn=p?entriesOf(p.id).filter(e=>e.kind==='in').pop():null;
  const rq=p&&(!ps||ps.length<2)&&lastIn;return `<div class="warow${rq?' w4':''}"><button onclick="waOpen(C('${c.id}'))">💬 مراسلة</button>${p?`<button onclick="${ps&&ps.length>1?`waPickSt('${c.id}')`:`waStatement('${p.id}')`}">📤 إرسال الكشف</button>`:''}${lastIn?`<button onclick="waReceipt('${lastIn.id}')">🧾 آخر وصل</button>`:''}${rq?`<button onclick="payReqSheet('${p.id}')">💰 طلب دفعة</button>`:''}</div>`}
function waPickSt(cid){const ps=live(S.projects).filter(p=>p.cid===cid);sheet(`<h3>إرسال كشف أي مشروع؟</h3><div class="list">${ps.map(p=>`<button class="li" onclick="closeSheet();waStatement('${p.id}')"><div class="ic">🏗️</div><div class="mid"><div class="t">${esc(p.name)}</div></div></button>`).join('')}</div><button class="btn ghost" onclick="closeSheet()">إغلاق</button>`)}
function rcptRef(e){return hashCode(e.id+'|'+e.amt+'|'+e.date+'|'+(e.no||''))}
function balAfter(e){const p=P(e.pid);const pct=p&&p.feeType==='pct'?(+p.feeVal||0)/100:0;let b=0;for(const x of entriesOf(e.pid)){if(x.kind==='in')b+=x.amt-Math.round(x.amt*pct);else b-=x.amt;if(x.id===e.id)break}return b}
function rcptText(e){const p=P(e.pid)||{},c=C(p.cid)||{};const b=balAfter(e);
  return `🧾 *وصل استلام* رقم ${e.no||''}\n\nاستلمنا من ${cName(c)} مبلغاً قدره *${fmt(e.amt)} دينار عراقي*\n(فقط ${words(e.amt)} دينار عراقي لا غير)\n\n🏗️ المشروع: ${p.name||''}${e.det?'\n📝 البيان: '+e.det:''}\n📅 تاريخ الاستلام: ${e.date}\n🙋 المستلم: ${e.rcv||e.by||S.me||''}\n💼 ${e.src==='حساب المصرف'?'تحويل إلى حساب المصرف':'نقداً'}${e.docType&&e.docType!=='دون مستند'&&e.docNo?'\n📄 '+e.docType+' '+e.docNo:''}\n\nرصيدكم في المشروع بعد هذه الدفعة: ${sfmt(b)} د.ع\nرمز التحقق: ${rcptRef(e)}\n\nمع التقدير، ${waSign()}\n— أُعدّ بنظام أسس`}
function waReceipt(id){const e=S.entries.find(x=>x.id===id);if(!e)return;const c=C((P(e.pid)||{}).cid)||{};waOpen(c,rcptText(e))}
function waStatement(pid){const p=P(pid),c=C(p.cid)||{},k=calc(p);
  waOpen(c,`📄 *كشف حساب* — ${p.name}\n${cName(c)} المحترم\nلغاية ${today()}\n\n↓ مجموع ما استلمناه منكم: ${fmt(k.inn)} د.ع\n↑ مجموع المصروف على المشروع: ${fmt(k.out)} د.ع\n👷 أتعاب المهندس (${feeLabel(p)}): ${fmt(k.fee)} د.ع\n\n${k.bal<0?'⚠️ المبلغ المطلوب منكم':'✅ الرصيد المتبقي لكم'}: *${fmt(Math.abs(k.bal))} د.ع*\n\nعدد الحركات: ${k.es.length} · الكشف المفصّل بالفواتير جاهز للطباعة عند الطلب.\n\nمع التقدير، ${waSign()}\n— أُعدّ بنظام أسس`)}
/* ---- طلب دفعة: تنبيه نفاد الرصيد ---- */
const alertPct=()=>{const v=+S.co.alertPct;return v>0&&v<100?v:20};
function payLevel(p){if(p.done||p.del)return null;const k=calc(p);if(!k.es.length)return null;const L=pays(p);const last=L[L.length-1];
  const ref=last?last.e.amt:0;const lim=Math.round(ref*alertPct()/100);
  const lv=k.bal<=0?'r':(k.bal<lim?'y':'g');return{lv,bal:k.bal,last,lim,k}}
function reqDefault(p){const z=payLevel(p);if(!z)return 0;const base=z.last?z.last.e.amt:0;return Math.max(0,(z.bal<0?-z.bal:0)+base)}
function needList(){return live(S.projects).map(p=>({p,z:payLevel(p)})).filter(x=>x.z&&x.z.lv!=='g').sort((a,b)=>a.z.bal-b.z.bal)}
function needSec(){const L=needList();if(!L.length)return '';
  return `<div class="sec"><h2>⚠️ زبائن يحتاجون دفعة (${L.length})</h2></div><section class="card need">${L.map(({p,z})=>{const c=C(p.cid)||{};
   return `<div class="nrow ${z.lv}"><button class="nmid" onclick="go('project','${p.id}')"><i class="ndot"></i><div><div class="t">${esc(cName(c))}</div><div class="s">${esc(p.name)} · ${z.bal<0?'تجاوز':(z.bal===0?'نفد الرصيد':'باقي')}</div></div><b class="amt ${z.bal<0?'neg':''}">${sfmt(z.bal)}</b></button>
     <button class="nbtn" onclick="payReqSheet('${p.id}')">📤 طلب دفعة</button></div>`}).join('')}
   <div class="nnote">التنبيه عندما ينزل الرصيد تحت <b class="num">${alertPct()}%</b> من آخر دفعة أو يصبح صفراً/سالباً · تغييره من «هوية الشركة»</div></section>`}
function payReqSheet(pid){payReqSend(pid)}

let REQ=0;
function payReqShow(pid){REQ=1;const p=P(pid),L=pays(p);if(!L.length){REQ=0;return toast('لا توجد دفعات مستلمة بعد')}closeSheet();readSTM();
  docOpen('كشف الدفعة '+ordN(L.length),payDoc(p,L[L.length-1],STM.annex),{no:`د-${stNo(p)}-${L.length}`,who:whoOf(p),client:cliSig(p)});REQ=0;
  const bar=$('#doc .docbar');if(bar)bar.insertAdjacentHTML('beforeend',`<button class="wa" onclick="payReqSend('${pid}')">💬 إرسال للزبون</button>`)}
function payReqText(p,url){const c=C(p.cid)||{},k=calc(p);const L=pays(p),x=L[L.length-1];
  return `السلام عليكم ${cName(c)} المحترم،\n\nنودّ إعلامكم بأن ${k.bal<0?'مصروفات المشروع تجاوزت المبالغ المستلمة':'رصيد مشروعكم قارب على النفاد'}:\n🏗️ ${p.name}\n\n${x?`↓ آخر دفعة استلمناها: ${fmt(x.e.amt)} د.ع (وصل ${x.e.no}، ${x.e.date})\n↑ صُرف منها: ${fmt(x.spent)} د.ع\n`:''}${k.bal<0?'⚠️ التجاوز الحالي':'✅ المتبقي الآن'}: *${fmt(Math.abs(k.bal))} د.ع*\n\n💰 *المطلوب: دفعة جديدة* ليستمر العمل دون توقف.\n\n${url?`📄 كشف الدفعة كاملاً (كل مصروف وكيف وصل الرصيد):\n${url}\n\n`:''}نشكر تعاونكم، ${waSign()}\n— أُعدّ بنظام أسس`}
async function payReqSend(pid){const p=P(pid),c=C(p.cid)||{};
  if(!waNum(c.phone))return toast('أضف رقم هاتف الزبون أولاً');const L=pays(p);let url='';
  let w=null;if(L.length&&MODE==='cloud'&&ME&&ME.org&&SB){w=window.open('about:blank','_blank');toast('جارٍ تجهيز رابط الكشف…');const keep=$('#doc').classList.contains('show')?$('#doc').innerHTML:null;
    REQ=1;readSTM();docOpen('كشف الدفعة '+ordN(L.length),payDoc(p,L[L.length-1],STM.annex),{no:`د-${stNo(p)}-${L.length}`,who:whoOf(p),client:cliSig(p)});REQ=0;
    const html=$('#paper').innerHTML;if(keep!==null){$('#doc').innerHTML=keep}else docClose();
    try{const r=await SB.rpc('asas_share_create',{p_org:ME.org,p_pid:pid,p_title:'كشف الدفعة '+ordN(L.length)+' · '+p.name,p_html:html});if(r.error)throw r.error;url=APP_URL+'?s='+r.data}
    catch(e){logErr&&logErr('share',e);toast('تعذّر إنشاء الرابط، سيُرسل الملخص فقط')}}
  closeSheet();const t=payReqText(p,url);if(w&&!w.closed){w.location.href='https://wa.me/'+waNum(c.phone)+'?text='+encodeURIComponent(t)}else waOpen(c,t)}
async function shareView(t){$('#app').innerHTML=`<div class="vfy"><div class="vf-c"><div class="vf-h">${helmet(44)}<b>أسس</b><span>كشف حساب</span></div><div class="vf-b">جارٍ التحميل…</div></div></div>`;
  let d=null;try{const r=await SB.rpc('asas_share_get',{p_token:t});d=r.data}catch(e){}
  if(!d||!d.ok){$('.vf-b').innerHTML='<div class="vf-st bad">✕ الرابط غير صحيح أو انتهى</div>';return}
  const D=$('#doc');D.innerHTML=`<div class="docbar shbar"><b>${esc(d.title||'كشف')}<span class="shsub">من ${esc(d.eng||d.office||'')} · <span class="num">${esc(d.phone||'')}</span></span></b><button class="y" onclick="doPrint()">🖨️ طباعة / PDF</button></div><div class="paperwrap"><div class="pscale" id="pscale"><div class="book" id="paper">${d.html}</div></div></div>`;
  D.classList.add('show');$('#app').innerHTML='';fitPaper()}
function rcptSheet(id,fresh){const e=S.entries.find(x=>x.id===id);if(!e)return;
  if(!noFixed(e))return sheet(`<h3>${fresh?'✓ تم تسجيل الاستلام':'وصل الاستلام'}</h3><div class="rcbox"><b class="num">${fmt(e.amt)} د.ع</b><div>⏳ محفوظ على جهازك وبانتظار الإنترنت</div></div><p class="mut" style="text-align:center;margin:6px 0 12px">يجهز الوصل ورقمه فور حفظ المبلغ على السيرفر، ويمكنك حينها إرساله إلى الزبون.</p><button class="btn y" onclick="closeSheet()">تمام</button>`);const c=C((P(e.pid)||{}).cid)||{};
  sheet(`<h3>${fresh?'✓ تم تسجيل الاستلام':'وصل الاستلام'}</h3>${MODE==='cloud'&&BASE.entries[id]===undefined?'<div class="rcoff">⏳ بدون إنترنت — رقم الوصل ثابت ولن يتغير، ويُحفظ على السيرفر فور عودة الاتصال</div>':''}<div class="rcbox"><div>وصل رقم <b class="num">${esc(e.no||'')}</b> · <span class="num">${e.date}</span></div><b class="num">${fmt(e.amt)} د.ع</b><div>من ${esc(cName(c))} · المستلم ${esc(e.rcv||e.by||S.me||'')}</div></div>
   <button class="btn wa" onclick="closeSheet();waReceipt('${id}')">💬 إرسال الوصل للزبون بالواتساب</button>
   <button class="btn" onclick="closeSheet();showReceipt('${id}')">🧾 عرض الوصل وطباعته</button>
   <button class="btn ghost" onclick="closeSheet()">لاحقاً</button>`)}
function rcptUrl(e){return MODE==='cloud'&&ME&&ME.org?APP_URL+'?r='+ME.org+'.'+e.id:''}
function loadQR(){if(window.qrcode)return Promise.resolve();return new Promise(r=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';sc.onload=r;sc.onerror=r;document.head.appendChild(sc)})}
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:3,margin:0,scalable:true})}catch(e){return ''}}
function rcHalf(e,copy){const p=P(e.pid)||{},c=C(p.cid)||{},co=S.co;const b=balAfter(e);const url=rcptUrl(e);
  const row=(l,v)=>`<div class="rr"><span>${l}</span><b>${v}</b></div>`;

    <div class="rc-tt"><h2>وصل استلام</h2><span class="rc-cp">${copy}</span></div>

function hashCode(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h.toString(36).toUpperCase().slice(-5).padStart(5,'0')}

function paginate(src,out){const M=DOCMETA;const pages=[];let page,body;const H=src.querySelector('.st-h');
  const newPage=()=>{page=document.createElement('div');page.className='paper apage';
    if(pages.length){if(H){const h=H.cloneNode(true);const t=h.querySelector('.st-tt');if(t)t.innerHTML=`<h1>${esc(M.title)}</h1><div>رقم <b class="num">${esc(M.no)}</b> · <span class="num">${M.date}</span> · رمز <b class="num">${M.ref}</b></div>`;page.appendChild(h)}
      page.insertAdjacentHTML('beforeend',`<div class="conth"><span><b>تابع</b> — ${esc(M.title)}</span><span>${esc(M.client||M.who)}</span><span class="pgx"></span></div>`)}
    body=document.createElement('div');body.className='sbody';page.appendChild(body);
    const f=document.createElement('div');f.className='sfoot';f.innerHTML=strip(1,1)+'<div class="sline">.</div>';page.appendChild(f);out.appendChild(page);pages.push(page)};
  const fits=()=>body.scrollHeight<=body.clientHeight+1;
  const curB=()=>{let b=body.lastElementChild;if(!b||!b.classList.contains('st-b')){b=document.createElement('div');b.className='st-b';body.appendChild(b)}return b};
  const brk=()=>{const b=body.lastElementChild;const prev=b&&b.classList.contains('st-b')?b.lastElementChild:null;
    if(prev&&prev.classList.contains('st-h3')){prev.remove();newPage();curB().appendChild(prev)}else newPage()};
  const put=(n,inB)=>{(inB?curB():body).appendChild(n);if(fits())return;n.remove();if(inB)brk();else newPage();(inB?curB():body).appendChild(n)};
  const putTable=t=>{const head=t.tHead,rows=[...t.tBodies[0].rows];let tb;
    const start=()=>{const nt=document.createElement('table');nt.className=t.className;nt.appendChild(head.cloneNode(true));tb=document.createElement('tbody');nt.appendChild(tb);curB().appendChild(nt);return nt};
    let nt=start();
    for(const r of rows){tb.appendChild(r);if(fits())continue;r.remove();if(!tb.rows.length){nt.remove();brk()}else newPage();nt=start();tb.appendChild(r)}};
  newPage();
  for(const top of [...src.children]){
    if(top.classList.contains('pgbrk')){if(body.children.length)newPage();continue}
    if(top.classList.contains('st-b')){for(const ch of [...top.children]){if(ch.matches('table.t'))putTable(ch);else put(ch,true)}continue}
    put(top,false)}
  const n=pages.length;
  pages.forEach((pg,i)=>{const px=pg.querySelector('.pgx');if(px)px.innerHTML=`ورقة <b>${i+1}</b> من <b>${n}</b>`;const last=i===n-1;pg.querySelector('.sfoot').innerHTML=

    `<div class="sline"><span>${esc(S.co.short||S.co.name)} · ${esc(M.title)} · رقم <b class="num">${esc(M.no)}</b> · <span class="num">${M.date}</span> · رمز <b class="num">${M.ref}</b> · ورقة ${i+1} من ${n}</span><span>${PLATFORM.footer} · للاشتراك: <span class="num">${PLATFORM.phone}</span></span></div>`});
  const b=$('#pages');if(b)b.textContent=n===1?'· ورقة A4 واحدة':`· ${n} أوراق A4`}

function donut(byCat,total){const R=62,L=2*Math.PI*R;let off=0;const segs=CATS.filter(c=>byCat[c.k]).map(c=>{const f=byCat[c.k]/total;const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${c.h}" stroke-width="26" stroke-dasharray="${f*L} ${L}" stroke-dashoffset="${-off*L}"/>`;off+=f;return s}).join('');
  const m=total>=1e6?(total/1e6).toFixed(1).replace(/\.0$/,'')+' م':fmt(total);
  return `<svg width="160" height="160" viewBox="0 0 160 160" style="flex:none"><g transform="rotate(-90 80 80)">${segs||`<circle r="${R}" cx="80" cy="80" fill="none" stroke="#E3E8F0" stroke-width="26"/>`}</g>

function pays(p){const es=entriesOf(p.id);const pct=p.feeType==='pct'?(+p.feeVal||0)/100:0;
  const L=es.filter(e=>e.kind==='in').map((e,i)=>({i:i+1,e,outs:[],fee:Math.round(e.amt*pct)}));if(!L.length)return L;
  let cur=0;for(const e of es){if(e.kind==='in')cur=L.findIndex(x=>x.e===e);else L[cur].outs.push(e)}
  let open=0;L.forEach((x,j)=>{x.open=open;x.spent=x.outs.reduce((a,e)=>a+e.amt,0);x.close=open+x.e.amt-x.fee-x.spent;open=x.close;
    x.to=L[j+1]?L[j+1].e.date:(x.outs.length?x.outs[x.outs.length-1].date:x.e.date);x.last=!L[j+1]});
  return L}

function stOuts(outs,dense){let cum=0;return `<table class="t ${dense?'dense':''}"><thead><tr><th>ت</th><th>التاريخ</th><th>البيان</th><th>البند</th><th>المدفوع له</th><th>المستند</th><th class="n">المبلغ (د.ع)</th><th class="n">التراكمي</th></tr></thead><tbody>

function itemKey(e){if(e.cat==='mat')return e.mat?e.mat.trim():String(e.det||'مواد').replace(/[\d.,]+/g,'').replace(/\b(كيس|طن|قطعة|م³|م²|حمل|لتر)\b/g,'').replace(/\s+/g,' ').trim()||'مواد';

function stSum(outs){const g={};for(const e of outs){const k=e.cat+'|'+(e.catx||'')+'|'+itemKey(e);const r=g[k]||(g[k]={cat:e.cat,catx:e.catx||'',name:itemKey(e),n:0,amt:0,qty:0,unit:'',from:e.date,to:e.date});

  ${rows.map(r=>`<tr><td><span class="cat">${r.catx||CATN[r.cat]||''}</span></td><td><b>${esc(r.name)}</b></td><td class="n">${r.n}</td><td>${r.qty?'<span class="num">'+(+r.qty).toLocaleString('en-US')+'</span> '+esc(r.unit):'—'}</td><td class="mut" style="white-space:nowrap">${r.from===r.to?'<span class="num">'+r.from+'</span>':'<span class="num">'+r.from+'</span> إلى <span class="num">'+r.to+'</span>'}</td><td class="n r"><b>${fmt(r.amt)}</b></td><td class="n mut">${t?Math.round(r.amt/t*100):0}%</td></tr>`).join('')||'<tr><td colspan="7" class="mut">لا توجد مصروفات</td></tr>'}
  <tr class="tot"><td colspan="2">مجموع المصروفات</td><td class="n">${outs.length}</td><td></td><td></td><td class="n">${fmt(t)}</td><td class="n">100%</td></tr></tbody></table>`}
function stExp(outs,title){return STM.mode==='sum'?`<div class="st-h3">${title} <span class="mut" style="font-weight:500;font-size:10.5px">(مختصر: كل مادة أو بند بسطر)</span></div>${stSum(outs)}`
  :`<div class="st-h3">${title}</div>${stOuts(outs,true)}${stMats(matsOf(outs))}`}
function annexDoc(p,outs,label){const c=C(p.cid)||{};return `<div class="pgbrk"></div><div class="ax-h"><b>ملحق: تفاصيل ${label}</b><span>${esc(c.name)} · ${esc(p.name)} · ${outs.length} مصروف</span></div><div class="st-b">${stOuts(outs,true)}</div>`}
function stMats(ms){return ms.length?`<div class="keep"><div class="st-h3">المواد</div><table class="t"><thead><tr><th>المادة</th><th>الوحدة</th><th class="n">الكمية</th><th class="n">متوسط سعر الوحدة (د.ع)</th><th class="n">المجموع (د.ع)</th></tr></thead><tbody>
  ${ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.unit)}</td><td class="n">${(+m.qty).toLocaleString('en-US')}</td><td class="n">${fmt(m.amt/m.qty)}</td><td class="n">${fmt(m.amt)}</td></tr>`).join('')}</tbody></table></div>`:''}
function stTail(bal,title,negTitle,note,client){return `<div class="keep"><div class="st-fin ${bal<0?'negf':''}"><div><h3>${bal<0?negTitle:title}</h3><p>فقط ${words(bal)} دينار عراقي لا غير</p></div><b>${bal<0?'−':''}${fmt(Math.abs(bal))} د.ع</b></div>
  <div class="st-note">${note}${S.demo?' · <b>بيانات تجريبية</b>':''}</div></div>`}
const stNo=p=>String(live(S.projects).indexOf(p)+1).padStart(3,'0');

/* كشف دفعة واحدة */
function payDoc(p,x,withAnnex){const c=C(p.cid)||{};const b=catsOf(x.outs);const pct=p.feeType==='pct';
  const kp=[];if(x.i>1)kp.push([x.open<0?'تجاوز من الدفعة السابقة':'متبقٍ من الدفعة السابقة',x.open]);
  kp.push(['مبلغ الدفعة '+ordN(x.i),x.e.amt]);if(pct)kp.push([`أتعاب المهندس ${+p.feeVal}%`,x.fee]);kp.push(['مصروف هذه الدفعة',x.spent]);
  kp.push([x.close<0?'تجاوز (يُخصم من الدفعة القادمة)':(x.last?'المتبقي من الدفعة':'المتبقي (دُوِّر للدفعة التالية)'),x.close,x.close<0?'negb':'']);
  const eq=`<div class="eq">${x.i>1?`<div><span>${x.open<0?'تجاوز سابق':'متبقٍ سابق'}</span><b class="${x.open<0?'r':''}">${sfmt(x.open)}</b></div>`:''}
    <div><span>+ الدفعة ${ordN(x.i)}</span><b class="g">${fmt(x.e.amt)}</b></div>${pct?`<div><span>− أتعاب المهندس</span><b>${fmt(x.fee)}</b></div>`:''}
    <div><span>− المصروفات (${x.outs.length})</span><b class="r">${fmt(x.spent)}</b></div><div class="eqt"><span>= ${x.close<0?'التجاوز':'المتبقي'}</span><b class="${x.close<0?'r':''}">${sfmt(x.close)}</b></div></div>`;
  return docHead('كشف الدفعة '+ordN(x.i),`رقم <span class="num">د-${stNo(p)}-${x.i}</span> · <span class="num">${today()}</span>`)+`<div class="st-b">
   ${stInfo(p,c,`<div><span class="m">الدفعة:</span> <b>${ordN(x.i)}</b> · <b class="num">${fmt(x.e.amt)}</b> د.ع · وصل <span class="rcn num">${x.e.no}</span></div>
     <div><span class="m">استُلمت:</span> <b class="num">${x.e.date}</b> · <span class="m">آخر صرف منها:</span> <b class="num">${x.outs.length?x.outs[x.outs.length-1].date:'—'}</b></div>
     <div><span class="m">الأتعاب:</span> <b>${esc(feeLabel(p))}</b> · <span class="m">المهندس:</span> <b>${esc(S.me)}</b></div>`)}
   ${stKpis(kp)}
   <div class="st-2"><div><div class="st-h3">حساب الدفعة</div>${eq}</div><div><div class="st-h3">أين صُرفت الدفعة</div>${stDonut(b,x.spent)}</div></div>
   ${stExp(x.outs,'مصروفات الدفعة '+ordN(x.i))}
   ${stTail(x.close,x.last?'المتبقي من الدفعة':'المتبقي ويُدوَّر للدفعة التالية','تجاوز الدفعة (يُخصم من الدفعة القادمة)',
     `المصروفات تُحسب على آخر دفعة مستلمة قبلها حسب التاريخ.${p.feeType==='fixed'?' الأتعاب المقطوعة تُحسب في الكشف النهائي.':''}${STM.mode==='sum'?(withAnnex?' تفاصيل كل وصل في الملحق.':' التفاصيل وصلاً بوصل متوفرة عند الطلب.'):''}`)}
   ${REQ&&x.last?`<div class="keep"><div class="st-req"><div><span class="rq-l">المطلوب: دفعة جديدة</span><p>${x.close<0?`المصروف تجاوز المبالغ المستلمة بمبلغ <b class="num">${fmt(-x.close)}</b> د.ع.`:(x.close===0?'نفد رصيد الدفعة.':`رصيد الدفعة قارب على النفاد (المتبقي <b class="num">${fmt(x.close)}</b> د.ع).`)} نرجو تسديد دفعة جديدة لمواصلة العمل.</p></div><b class="rq-ic">💰</b></div></div>`:''}</div>`+(withAnnex&&STM.mode==='sum'&&x.outs.length?annexDoc(p,x.outs,'مصروفات الدفعة '+ordN(x.i)):'')}
function showPayment(pid,i){readSTM();const p=P(pid),x=pays(p)[i-1];closeSheet();docOpen('كشف الدفعة '+ordN(i),payDoc(p,x,STM.annex),{no:`د-${stNo(p)}-${i}`,who:whoOf(p),client:cliSig(p),pid:p.id})}
const whoOf=p=>((C(p.cid)||{}).name||'')+' · '+p.name;
const cliSig=p=>{const c=C(p.cid)||{};return c.name?((c.title?c.title+' ':'')+c.name):''};
function readSTM(){const a=$('#st-annex');if(a)STM.annex=a.checked}

/* كشف نهائي مختصر بالدفعات */
function showFinal(pid){readSTM();const annex=STM.annex;const p=P(pid),c=C(p.cid)||{},k=calc(p),L=pays(p);closeSheet();
  const dates=k.es.map(e=>e.date);const neg=k.bal<0;
  let html=docHead('كشف حساب نهائي',`رقم <span class="num">ك-${stNo(p)}</span> · <span class="num">${today()}</span>`)+`<div class="st-b">
   ${stInfo(p,c,`<div><span class="m">الفترة:</span> <b class="num">${dates[0]||p.start}</b> إلى <b class="num">${dates[dates.length-1]||today()}</b></div>
     <div><span class="m">عدد الدفعات:</span> <b>${L.length}</b> · <span class="m">عدد المصروفات:</span> <b>${k.es.length-L.length}</b></div>
     <div><span class="m">الأتعاب:</span> <b>${esc(feeLabel(p))}</b> · <span class="m">المهندس:</span> <b>${esc(S.me)}</b></div>`)}
   ${stKpis([['مجموع المقبوض',k.inn],['مجموع المصروف',k.out],['أتعاب المهندس',k.fee],[neg?'مطلوب من الزبون':'الرصيد للزبون',k.bal,neg?'negb':'']])}
   <div class="st-h3">الدفعات وأين ذهبت كل دفعة</div>
   <table class="t"><thead><tr><th>الدفعة</th><th>التاريخ</th><th>رقم الوصل</th><th class="n">مبلغ الدفعة</th>${p.feeType==='pct'?'<th class="n">الأتعاب</th>':''}<th class="n">صُرف منها</th><th class="n">عدد المصروفات</th><th class="n">الرصيد بعدها</th></tr></thead><tbody>
    ${L.map(x=>`<tr><td><b>${ordN(x.i)}</b></td><td class="num">${x.e.date}</td><td><span class="rcn num">${x.e.no}</span></td><td class="n g"><b>${fmt(x.e.amt)}</b></td>${p.feeType==='pct'?`<td class="n">${fmt(x.fee)}</td>`:''}<td class="n r">${fmt(x.spent)}</td><td class="n">${x.outs.length}</td><td class="n ${x.close<0?'r':''}"><b>${sfmt(x.close)}</b></td></tr>`).join('')}
    ${p.feeType==='fixed'?`<tr><td colspan="4">أتعاب المهندس المقطوعة</td><td class="n"></td><td></td><td class="n r"><b>−${fmt(k.fee)}</b></td></tr>`:''}
    <tr class="tot"><td colspan="3">المجموع</td><td class="n">${fmt(k.inn)}</td>${p.feeType==='pct'?`<td class="n">${fmt(k.fee)}</td>`:''}<td class="n">${fmt(k.out)}</td><td class="n">${k.es.length-L.length}</td><td class="n">${sfmt(k.bal)}</td></tr></tbody></table>
   <div class="st-2" style="grid-template-columns:1fr 1.2fr"><div><div class="st-h3">أين صُرف المبلغ</div>${stDonut(k.byCat,k.out)}</div>
    <div>${k.mats.length?'':'<div class="st-h3">ملاحظة</div><p class="mut">تفاصيل كل مصروف موجودة في كشوف الدفعات.</p>'}${stMats(k.mats)}</div></div>
   ${stTail(k.bal,'الرصيد المتبقي للزبون','المبلغ المطلوب من الزبون',`الرصيد = المقبوض − المصروف − أتعاب المهندس. تفاصيل كل مصروف في كشف دفعته${annex?' (مرفقة بعد هذه الصفحة)':''}.`)}</div>`;
  if(annex)for(const x of L)html+=`<div class="pgbrk"></div>`+payDoc(p,x,false);
  docOpen('كشف حساب نهائي',html,{no:'ك-'+stNo(p),who:whoOf(p),client:cliSig(p),pid:p.id})}

/* كشف حسب فترة */
function showPeriod(pid,from,to){readSTM();if(!okDate(from)||!okDate(to))return toast('اختر التاريخ');if(from>to)return toast('يجب أن يكون تاريخ «من» قبل «إلى»');
  const p=P(pid),c=C(p.cid)||{},es=entriesOf(pid);const pct=p.feeType==='pct'?(+p.feeVal||0)/100:0;closeSheet();
  let open=0;for(const e of es)if(e.date<from)open+=e.kind==='in'?e.amt-Math.round(e.amt*pct):-e.amt;
  const r=es.filter(e=>e.date>=from&&e.date<=to),ins=r.filter(e=>e.kind==='in'),outs=r.filter(e=>e.kind==='out');
  const inn=ins.reduce((a,e)=>a+e.amt,0),fee=ins.reduce((a,e)=>a+Math.round(e.amt*pct),0),out=outs.reduce((a,e)=>a+e.amt,0),close=open+inn-fee-out;
  const kp=[['رصيد قبل الفترة',open],['المقبوض خلال الفترة',inn]];if(pct)kp.push(['أتعاب المهندس',fee]);kp.push(['المصروف خلال الفترة',out],[close<0?'تجاوز آخر الفترة':'الرصيد آخر الفترة',close,close<0?'negb':'']);
  const html=docHead('كشف حساب لفترة',`من <span class="num">${from}</span> إلى <span class="num">${to}</span>`)+`<div class="st-b">
   ${stInfo(p,c,`<div><span class="m">الفترة:</span> <b class="num">${from}</b> إلى <b class="num">${to}</b></div><div><span class="m">الأتعاب:</span> <b>${esc(feeLabel(p))}</b></div><div><span class="m">المهندس المشرف:</span> <b>${esc(S.me)}</b></div>`)}
   ${stKpis(kp)}
   <div class="st-2"><div><div class="st-h3">المبالغ المقبوضة في الفترة</div><table class="t"><thead><tr><th>التاريخ</th><th>البيان</th><th>رقم الوصل</th><th class="n">المبلغ</th></tr></thead><tbody>
     ${ins.map(e=>`<tr><td class="num">${e.date}</td><td>${esc(e.det)}</td><td><span class="rcn num">${e.no}</span></td><td class="n g"><b>${fmt(e.amt)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="mut">لا يوجد</td></tr>'}
     <tr class="tot"><td colspan="3">المجموع</td><td class="n">${fmt(inn)}</td></tr></tbody></table></div>
    <div><div class="st-h3">أين صُرف المبلغ</div>${stDonut(catsOf(outs),out)}</div></div>
   ${stExp(outs,'المصروفات خلال الفترة')}
   ${stTail(close,'الرصيد في آخر الفترة','التجاوز في آخر الفترة',`الرصيد = رصيد قبل الفترة + المقبوض − الأتعاب − المصروف.${p.feeType==='fixed'?' الأتعاب المقطوعة تُحسب في الكشف النهائي.':''}`)}</div>`+(STM.annex&&STM.mode==='sum'&&outs.length?annexDoc(p,outs,'مصروفات الفترة'):'');
  docOpen('كشف حساب لفترة',html,{no:'ف-'+stNo(p),who:whoOf(p),client:cliSig(p),pid:p.id})}

/* نافذة اختيار نوع الكشف */
function setSTM(m){STM.mode=m;document.querySelectorAll('#stm button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(m==='sum')));$('#stm-h').textContent=m==='sum'?'مثال: كل الطابوق بسطر واحد بعدد وصولاته ومجموعه. يبقى الكشف في ورقة واحدة.':'كل وصل بسطر. الكشف الطويل يستمر في أكثر من ورقة.'}
function stvBtn(fn){return `<button class="stv" onclick="${fn}">${pjIc('doc')}<span>عرض الكشف</span></button>`}
function showStatement(pid){const p=P(pid),c=C(p.cid)||{},L=pays(p),k=calc(p);const es=entriesOf(pid);
  sheet(`<h3>كشف ${esc(c.name)} · ${esc(p.name)}</h3><div class="stopt"><b>طريقة عرض المصروفات</b>
    <div class="cats" id="stm"><button class="${STM.mode==='sum'?'on':''}" onclick="setSTM('sum')">مختصر · سطر لكل مادة</button><button class="${STM.mode==='det'?'on':''}" onclick="setSTM('det')">مفصّل · كل وصل بسطر</button></div>
    <p class="note" style="margin:0" id="stm-h">${STM.mode==='sum'?'مثال: كل الطابوق بسطر واحد بعدد وصولاته ومجموعه. يبقى الكشف في ورقة واحدة.':'كل وصل بسطر. الكشف الطويل يستمر في أكثر من ورقة.'}</p>
    <label class="ck2"><input type="checkbox" id="st-annex" ${STM.annex?'checked':''}> أرفق التفاصيل بملحق بعد الكشف</label></div>
   <p class="note" style="margin:0">اختر نوع الكشف:</p>
   <div class="stopt"><div class="sth"><b>١. كشف دفعة</b> <span class="chip g">الأكثر استعمالاً</span><p>عند انتهاء دفعة وطلب الدفعة التالية من الزبون: يبيّن أين صُرفت هذه الدفعة. ورقة واحدة.</p></div>
    ${L.map(x=>`<div class="sprow"><div class="spi"><div class="mid"><div class="t">الدفعة ${ordN(x.i)} · <span class="num">${fmt(x.e.amt)}</span></div><div class="s"><span class="num">${x.e.date}</span> · ${x.outs.length} مصروف</div></div>
      <div class="pb"><b class="amt ${x.close<0?'neg':'pos'}">${sfmt(x.close)}</b><span>${x.close<0?'تجاوز':(x.last?'متبقٍ منها':'دُوِّر')}</span></div></div>${stvBtn(`showPayment('${pid}',${x.i})`)}</div>`).join('')||'<div class="note">لا توجد دفعات مستلمة بعد</div>'}</div>
   <div class="stopt"><div class="sth"><b>٢. كشف نهائي</b><p>عند إكمال البيت أو الدار: ملخص جميع الدفعات والرصيد النهائي في ورقة واحدة. الملحق يضيف كشف كل دفعة.</p></div>
    <div class="sprow"><div class="spi"><div class="mid"><div class="t">كل الدفعات · <span class="num">${L.length}</span> دفعة</div><div class="s">الملخص النهائي للمشروع</div></div>
      <div class="pb"><b class="amt ${k.bal<0?'neg':'pos'}">${sfmt(k.bal)}</b><span>${k.bal<0?'تجاوز':'الرصيد'}</span></div></div>${stvBtn(`showFinal('${pid}')`)}</div></div>
   <div class="stopt"><div class="sth"><b>٣. كشف حسب فترة</b><p>من تاريخ إلى تاريخ تختاره أنت.</p></div>
    <div class="sprow"><div class="dpw"><label>من</label>${dpk('sp-from',es[0]?es[0].date:today())}</div>
    <div class="dpw"><label>إلى</label>${dpk('sp-to',today())}</div>
    ${stvBtn(`showPeriod('${pid}',$('#sp-from').value.trim(),$('#sp-to').value.trim())`)}</div></div>
   <button class="btn ghost" onclick="closeSheet()">إغلاق</button>`)}
function showCashbook(from,to){if(!okDate(from)||!okDate(to))return toast('اختر التاريخ');if(from>to)return toast('يجب أن يكون تاريخ «من» قبل «إلى»');
  const all=live(S.entries).filter(e=>((P(e.pid)&&!P(e.pid).del)||e.pid==='office')&&!e.cu).map(e=>e.kind==='cg'||e.kind==='cr'?Object.assign({},e,{kind:e.kind==='cr'?'in':'out',party:tmName(e.cu),det:e.kind==='cg'?'عهدة إلى '+tmName(e.cu):'إرجاع عهدة من '+tmName(e.cu),docType:'دون مستند'}):e).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  let open=0;for(const e of all)if(e.date<from)open+=e.kind==='in'?e.amt:-e.amt;
  const rows=all.filter(e=>e.date>=from&&e.date<=to);let bal=open,ti=0,to2=0;
  const html=docHead('سجل يومية القاصة',`من <span class="num">${from}</span> إلى <span class="num">${to}</span>`)+`<div class="st-b">
   <table class="t cb"><thead><tr><th>ت</th><th class="n">مقبوضات</th><th class="n">مدفوعات</th><th>المقبوض منه / المدفوع له</th><th>البيان</th><th>المستند</th><th>التاريخ</th><th>المشروع</th><th class="n">الرصيد</th></tr></thead><tbody>
   <tr><td></td><td></td><td></td><td colspan="5"><b>رصيد أول المدة</b></td><td class="n"><b>${sfmt(open)}</b></td></tr>
   ${rows.map((e,i)=>{if(e.kind==='in'){bal+=e.amt;ti+=e.amt}else{bal-=e.amt;to2+=e.amt}const p=P(e.pid),c=p?(C(p.cid)||{}):{name:'المكتب'};
     return `<tr><td>${i+1}</td><td class="n g">${e.kind==='in'?fmt(e.amt):''}</td><td class="n r">${e.kind==='out'?fmt(e.amt):''}</td><td>${esc(e.party)}</td><td>${esc(e.det)}${e.note?` <span class="mut">(${esc(e.note)})</span>`:''}</td><td>${e.docType==='دون مستند'?'—':esc(e.docType)+' <span class="num">'+esc(e.docNo||e.no)+'</span>'}</td><td class="num">${e.date}</td><td>${esc(c.name)}</td><td class="n">${sfmt(bal)}</td></tr>`}).join('')}
   <tr class="tot keep"><td>المجموع</td><td class="n">${fmt(ti)}</td><td class="n">${fmt(to2)}</td><td colspan="5">رصيد آخر المدة</td><td class="n">${sfmt(bal)}</td></tr></tbody></table>
</div>`;
  docOpen('سجل يومية القاصة',html,{no:from+' / '+to,who:S.co.short||'',sigs:['المحاسب','المهندس','المدقق']})}

</script>

const HAS_CLOUD=/^https:\/\//.test(CLOUD.url)&&!!window.supabase;

let MODE='demo',SB=null,ME=null,BASE={clients:{},projects:{},entries:{},co:''},SINCE={},SYNC={st:'ok',busy:false,again:false,t:null},MEMBERS=[];
const CAN={edit:true,del:true,admin:true};
function subLeft(){if(MODE!=='cloud'||IS_ADMIN||!S||!S.sub||!S.sub.until)return null;return Math.ceil((Date.parse(S.sub.until)-Date.now())/864e5)}
function subEnded(){const n=subLeft();return n!==null&&(n<=0||!!(S.sub&&S.sub.susp))}
function setCan(){const r=MODE==='cloud'?ME.role:'owner';const end=subEnded();CAN.edit=r!=='viewer'&&!end;CAN.del=(r==='owner'||(MODE==='cloud'&&r==='assistant'&&ME.eng))&&!end;CAN.admin=r==='owner';
  document.body.classList.toggle('ro',!CAN.edit);document.body.classList.toggle('nodel',!CAN.del)}
const normPhone=p=>{let d=String(p||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'');
  if(d.startsWith('00964'))d=d.slice(5);else if(d.startsWith('964'))d=d.slice(3);if(d.startsWith('0'))d=d.slice(1);return /^7\d{9}$/.test(d)?d:''};
const cacheKey=()=>'asas_c_'+(ME&&ME.uid);
const J=x=>JSON.stringify(x);
/* --- الحفظ المضمون على الجهاز (بدون إنترنت): نسختان، localStorage + IndexedDB --- */
let IDB_C=null,PERSIST_WARN=0;const IDB={db:null};
function idbOpen(){return new Promise(res=>{if(IDB.db)return res(IDB.db);try{const r=indexedDB.open('asas',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res(IDB.db)};r.onerror=()=>res(null)}catch(e){res(null)}})}
async function idbPut(k,v){const db=await idbOpen();if(!db)return false;return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}
async function idbGet(k){const db=await idbOpen();if(!db)return null;return new Promise(res=>{try{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>{try{res(r.result?JSON.parse(r.result):null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}})}
async function idbDel(k){const db=await idbOpen();if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}
function persist(){if(MODE!=='cloud'||!ME||!S)return;const s=J({org:ME.org,ME,S,BASE,SINCE,ts:Date.now()});let ok=true;
  try{localStorage.setItem(cacheKey(),s)}catch(e){ok=false}
  idbPut(cacheKey(),s).then(ok2=>{if(!ok&&!ok2&&Date.now()-PERSIST_WARN>60000){PERSIST_WARN=Date.now();toast('⚠️ ذاكرة الجهاز ممتلئة — لا تغلق التطبيق حتى يعود الإنترنت')}})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const isNetErr=e=>!!e&&/fetch|network|load failed|timeout|abort/i.test(String(e.message||e));
const withTO=(pr,ms)=>Promise.race([pr,new Promise(r=>setTimeout(()=>r({data:null,error:{message:'timeout'}}),ms))]);
const isOff=()=>MODE==='cloud'&&(navigator.onLine===false||SYNC.st==='off');
const pendE=e=>MODE==='cloud'&&BASE.entries&&BASE.entries[e.id]!==J(e);

/* --- التخزين المحلي --- */
load=function(){if(MODE==='cloud'){let c=null;try{c=JSON.parse(localStorage.getItem(cacheKey())||'null')}catch(e){}
    if(IDB_C&&IDB_C.org===ME.org&&(!c||(IDB_C.ts||0)>(c.ts||0)))c=IDB_C;
    if(c&&c.S&&c.S.v===1&&c.org===ME.org){S=c.S;BASE=c.BASE||BASE;SINCE=c.SINCE||{}}else{S=emptyS();BASE={clients:{},projects:{},entries:{},co:''};SINCE={}}
    S.me=ME.name;S.demo=false;return}
  try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}if(!S||S.v!==1)S=demo()};
save=function(){if(MODE==='cloud'){persist();schedPush();return}
  try{localStorage.setItem(KEY,J(S))}catch(e){toast('تعذّر الحفظ في هذا المتصفح')}};
/* --- أرقام ثابتة بدون إنترنت: كل جهاز يحجز أرقاماً مسبقاً من السيرفر وهو متصل --- */
let NOFIX=false;const POOL_N={in:5,out:10};
async function poolFill(){if(MODE!=='cloud'||!ME||!S||!CAN.edit||navigator.onLine===false||POOL_BUSY)return;POOL_BUSY=true;
  try{S.pool=S.pool||{in:[],out:[]};for(const k of ['in','out']){const have=S.pool[k]||(S.pool[k]=[]);if(have.length>=Math.ceil(POOL_N[k]/2))continue;
      const{data,error}=await withTO(SB.rpc('asas_reserve_nos',{p_org:ME.org,p_kind:k,p_count:POOL_N[k]-have.length}),10000);
      if(!error&&Array.isArray(data)){for(const n of data)if(!have.includes(n))have.push(n);have.sort((a,b)=>a-b)}}
    persist()}catch(e){}POOL_BUSY=false}
let POOL_BUSY=false;
async function poolRelease(){if(MODE!=='cloud'||!S||!S.pool)return;for(const k of ['in','out']){const a=S.pool[k]||[];if(!a.length)continue;
  try{await withTO(SB.rpc('asas_release_nos',{p_org:ME.org,p_kind:k,p_nos:a}),6000)}catch(e){}}}
const noFixed=e=>MODE!=='cloud'||BASE.entries[e.id]!==undefined||!!e.nf;
function emptyS(){return{v:1,created:today(),me:ME?ME.name:'',co:{},clients:[],projects:[],entries:[],trash:[],seq:{in:0,out:0,st:0},demo:false}}
nextNo=function(kind){const k=kind==='in'?'in':'out',pre=k==='in'?'ق-':'ص-';
  if(MODE==='cloud'){NOFIX=false;const pl=S.pool&&S.pool[k];if(pl&&pl.length){NOFIX=true;const n=pl.shift();persist();setTimeout(poolFill,500);return pre+String(n).padStart(4,'0')}
    const mx=S.entries.filter(e=>e.kind===k).reduce((m,e)=>Math.max(m,+String(e.no||'').replace(/\D/g,'')||0),0);return pre+String(mx+1).padStart(4,'0')}
  S.seq[k]=(S.seq[k]||0)+1;return pre+String(S.seq[k]).padStart(4,'0')};

/* --- المزامنة مع السيرفر --- */
function schedPush(){clearTimeout(SYNC.t);SYNC.t=setTimeout(push,350)}
function dirty(){const out={};for(const t in TBL){out[t]=S[t].filter(r=>J(r)!==BASE[t][r.id])}
  out.co=CAN.admin&&J(S.co)!==BASE.co;return out}
function pendingCount(){const d=dirty();return d.clients.length+d.projects.length+d.entries.length+(d.co?1:0)}
async function push(){if(MODE!=='cloud')return;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;let bad=false,denied=false,net=false;
  try{const d=dirty();if(d.clients.length+d.projects.length+d.entries.length||d.co){const{data:ss}=await withTO(SB.auth.getSession(),10000);if(!ss||!ss.session)throw new Error('network: no session')}
    await attUpload();
    for(const t in TBL){if(!d[t].length)continue;const sent={};
      const rows=d[t].map(r=>{const s=J(r);sent[r.id]=s;return{org_id:ME.org,id:r.id,data:r}});
      for(let i=0;i<rows.length;i+=200){const part=rows.slice(i,i+200);
        const{data,error}=await SB.from(TBL[t]).upsert(part,{onConflict:'org_id,id'}).select('id,data,updated_at');
        if(error){bad=true;if(isNetErr(error))net=true;if(/project limit/i.test(error.message)){SYNC.lim=true;denied=true}else if(error.code==='42501'||/not allowed|only the owner|row-level/i.test(error.message))denied=true;continue}
        for(const row of data){const loc=S[t].find(r=>r.id===row.id);
          if(!loc){BASE[t][row.id]=J(row.data);continue}
          const same=J(loc)===sent[row.id];
          if(t==='entries'&&row.data.no&&loc.no!==row.data.no)loc.no=row.data.no; // رقم السند يحدده السيرفر
          BASE[t][row.id]=same?J(loc):sent[row.id]}}}
    if(d.co){const s=J(S.co);const{error}=await SB.from('asas_orgs').update({co:S.co,name:S.co.short||S.co.name||'مكتب'}).eq('id',ME.org);if(error){bad=true;if(isNetErr(error))net=true}else BASE.co=s}
  }catch(e){bad=true;net=true}
  SYNC.busy=false;SYNC.st=bad?(net||navigator.onLine===false?'off':'err'):'ok';
  persist();
  syncBadge();
  if(denied){if(SYNC.lim){SYNC.lim=false;limitSheet()}else toast('ليست لديك صلاحية لهذا التعديل');await pull(true);render()}
  if(!bad)poolFill();
  if(SYNC.again){SYNC.again=false;schedPush()}else if(bad)setTimeout(schedPush,net?10000:15000)}
async function pageAll(q){const out=[];for(let from=0;;from+=1000){const{data,error}=await q().range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function pull(force){if(MODE!=='cloud')return false;
  try{const{data:org,error:oe}=await SB.from('asas_orgs').select('co,created_at,trial_until,paid_until,plan,extra_eng,extra_asst,suspended_at').eq('id',ME.org).single();if(oe)throw oe;
    if(force||BASE.co===''||J(S.co)===BASE.co){S.co=Object.assign({eng:'',name:'',short:'',city:'',phone:'',logo:'',stamp:'',stampText:''},org.co||{});BASE.co=J(S.co)}
    S.created=(org.created_at||'').slice(0,10)||S.created;
    const until=[org.trial_until,org.paid_until].filter(Boolean).sort().pop();const was=subEnded();S.sub={until,paid:!!org.paid_until&&org.paid_until>=org.trial_until,plan:org.plan||'',xe:org.extra_eng||0,xa:org.extra_asst||0,susp:!!org.suspended_at};setCan();if(was!==subEnded())render();
    let changed=false;
    for(const t in TBL){const since=force?null:SINCE[t];
      const rows=await pageAll(()=>{let q=SB.from(TBL[t]).select('id,data,updated_at').eq('org_id',ME.org).order('updated_at').order('id');return since?q.gte('updated_at',since):q});
      for(const row of rows){const i=S[t].findIndex(r=>r.id===row.id);const loc=i>=0?S[t][i]:null;
        const localDirty=loc&&J(loc)!==BASE[t][row.id];
        if(!force&&localDirty)continue;
        if(!loc)S[t].push(row.data);else if(J(loc)!==J(row.data))S[t][i]=row.data;else continue;
        BASE[t][row.id]=J(row.data);changed=true}
      if(rows.length)SINCE[t]=rows[rows.length-1].updated_at}
    if(force){for(const t in TBL)S[t]=S[t].filter(r=>BASE[t][r.id]!==undefined)}
    SYNC.st=pendingCount()?SYNC.st:'ok';
    persist();
    syncBadge();return changed}
  catch(e){SYNC.st=(navigator.onLine===false||isNetErr(e))?'off':'err';syncBadge();return false}}
function idle(){return !$('#layer').innerHTML&&V.v!=='entry'&&!document.body.classList.contains('docopen')}
async function refresh(){if(MODE!=='cloud')return;if(pendingCount())await push();const ch=await pull();if(ch&&idle())render()}
function netWatch(){if(MODE!=='cloud')return;const off=isOff(),n=pendingCount();
  if(off&&!NET.off){NET.off=true;NET.n=n;toast('📴 انقطع الإنترنت — تابع عملك كالمعتاد، كل شيء يُحفظ على جهازك')}
  if(off)NET.n=Math.max(NET.n||0,n);
  if(!off&&NET.off&&!n){NET.off=false;toast(NET.n?'✓ عاد الإنترنت وتم الحفظ '+(NET.n===1?'مبلغ واحد':NET.n+' عمليات')+' على السيرفر':'✓ عاد الإنترنت');NET.n=0;if(idle())render()}
  else if(!off&&!n&&NET.had){NET.had=false;if(idle())render()}
  if(n)NET.had=true;netBar()}
const NET={off:false,n:0,had:false};
function netBar(){const w=$('#app .wrap');let d=$('#netbar');const show=MODE==='cloud'&&['home','project','quick'].includes(V.v)&&isOff();
  if(!show){if(d)d.remove();return}if(!w)return;const n=pendingCount();
  if(!d){d=document.createElement('div');d.id='netbar';d.className='netbar';w.prepend(d)}
  d.innerHTML=`<b>📴 أنت الآن غير متصل بالإنترنت</b><span>سجّل مبالغك كالمعتاد — تُحفظ على جهازك وتُرفع إلى السيرفر تلقائياً فور عودة الاتصال.</span>${n?`<span class="nb-n">⏳ بانتظار الحفظ على السيرفر: <b class="num">${n}</b></span>`:''}`}
function syncBadge(){netWatch();const b=$('#sync');if(!b)return;const n=MODE==='cloud'?pendingCount():0;
  const st=MODE!=='cloud'?'demo':isOff()?'off':n?'wait':'ok';b.className='sync '+st+(b.classList.contains('inhdr')?' inhdr':'');
  b.innerHTML='<i></i>'+(st==='demo'?'تجريبي':st==='ok'?'متزامن':st==='off'?'دون إنترنت'+(n?' ('+n+')':''):'يحفظ…');
  b.title=st==='demo'?'تجربة · البيانات على هذا الجهاز فقط':st==='ok'?'كل شيء محفوظ على السيرفر':st==='off'?'دون إنترنت · ستُحفظ عند الاتصال':'جارٍ الحفظ على السيرفر…'}
window.addEventListener('online',()=>{if(MODE==='cloud'){SYNC.st=pendingCount()?'wait':'ok';syncBadge();refresh()}});

function helmet(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64"><path d="M10 42a22 22 0 0 1 44 0z" fill="#F5B800"/><path d="M27 20h10v22H27z" fill="#E0A200"/><rect x="6" y="41" width="52" height="7" rx="3.5" fill="#F5B800"/></svg>`}
async function authGo(){if(AUTH.busy)return;const up=AUTH.tab==='up';const ph=normPhone($('#a-ph').value),pw=$('#a-pw').value;
  const name=up?$('#a-name').value.trim():'',co=up?$('#a-co').value.trim():'';
  const keep={ph:$('#a-ph').value,name,co};
  if(up&&!name)return authErr('اكتب اسمك',keep);if(!ph)return authErr('رقم الموبايل غير صحيح، اكتبه مثل 07701234567',keep);if(pw.length<6)return authErr('كلمة السر 6 أحرف على الأقل',keep);
  AUTH.busy=true;AUTH.err='';render();refill(keep);
  try{if(up){const r=await fetch(CLOUD.url+'/functions/v1/asas-signup',{method:'POST',headers:{'Content-Type':'application/json',apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key},body:J({phone:ph,password:pw,name,company:co})});
      const j=await r.json().catch(()=>({}));if(!r.ok&&j.error!=='taken')throw new Error(j.msg||'تعذّر إنشاء الحساب');if(j.error==='taken'){AUTH.tab='in';throw new Error(j.msg)}}
    const{error}=await SB.auth.signInWithPassword({email:ph+'@asas.app',password:pw});
    if(error)throw new Error(/invalid/i.test(error.message)?'الرقم أو كلمة السر غير صحيحة':'تعذّر الدخول، تأكد من الإنترنت');

  catch(e){AUTH.busy=false;authErr(e.message==='Failed to fetch'?'تعذّر الاتصال، تأكد من الإنترنت':e.message,keep)}}
function authErr(m,keep){AUTH.err=m;render();refill(keep)}
function refill(k){if(!k)return;const s=(id,v)=>{const el=$('#'+id);if(el&&v)el.value=v};s('a-ph',k.ph);s('a-name',k.name);s('a-co',k.co)}
function startDemo(){try{localStorage.setItem('asas_mode','demo')}catch(e){}MODE='demo';ME=null;load();setCan();go('home')}

  load();setCan();go('home');if(bioKey())bioShow();await pull();purgeOld();if(idle())render();push();poolFill();checkAdmin().then(remind)}
async function logout(){if(pendingCount()){await push();if(pendingCount())return ask('توجد تعديلات لم تُحفظ على السيرفر بسبب انقطاع الإنترنت، وستضيع عند الخروج. هل تريد الخروج؟','الخروج على أي حال',doLogout)}
  ask('تسجيل خروج من هذا الجهاز؟','تسجيل خروج',doLogout)}

const guard=(fn,need,msg)=>function(){if(!CAN[need])return toast(subEnded()?ENDMSG:msg);return fn.apply(this,arguments)};

function bioKey(){try{return localStorage.getItem('asas_bio')||''}catch(e){return ''}}
function b2u(b){let s='';new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function u2b(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}

  if(!(await bioSupported()))return toast('هذا الجهاز أو المتصفح لا يدعم القفل بالبصمة');
  try{const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'أسس'},

      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
    localStorage.setItem('asas_bio',b2u(cred.rawId));toast('تم تفعيل القفل بالبصمة ✓');render()}catch(e){toast('لم يتم تفعيل القفل بالبصمة')}}

/* ===== التقرير الشهري للمهندس ===== */
const MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
function monthName(ym){const[y,m]=ym.split('-');return (+m)+'/'+y}
function monthData(ym){const rows={};let inn=0,out=0,fee=0;const byCat={};
  const firstIn={};for(const e of live(S.entries).filter(e=>e.kind==='in').sort((a,b)=>a.date.localeCompare(b.date)))if(!firstIn[e.pid])firstIn[e.pid]=e.date;
  for(const e of live(S.entries)){const p=P(e.pid);if(!p||p.del||!e.date.startsWith(ym))continue;
    const r=rows[p.id]||(rows[p.id]={p,inn:0,out:0,fee:0,fixed:false});
    if(e.kind==='in'){r.inn+=e.amt;inn+=e.amt;if(p.feeType==='pct'){const f=Math.round(e.amt*(+p.feeVal||0)/100);r.fee+=f;fee+=f}}
    else{r.out+=e.amt;out+=e.amt;byCat[e.cat]=(byCat[e.cat]||0)+e.amt}}
  for(const p of live(S.projects))if(p.feeType!=='pct'&&+p.feeVal&&firstIn[p.id]&&firstIn[p.id].startsWith(ym)){const r=rows[p.id]||(rows[p.id]={p,inn:0,out:0,fee:0});r.fee+=+p.feeVal;r.fixed=true;fee+=+p.feeVal}
  return{rows:Object.values(rows).sort((a,b)=>b.inn-a.inn||b.out-a.out),inn,out,fee,byCat}}
function prevYm(ym){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function showMonthly(ym){if(!/^\d{4}-\d{2}$/.test(ym||''))return toast('اكتب الشهر هكذا: 2026-11');
  const d=monthData(ym),pv=monthData(prevYm(ym));const net=d.inn-d.out-d.fee;
