async function admTry(body){try{const{data,error}=await SB.functions.invoke('asas-admin',{body});if(error){let j={};try{j=await error.context.json()}catch(e){}return{_err:1,msg:j.msg||'تعذّر تنفيذ العملية'}}return data||{}}catch(e){return{_err:1,msg:'تعذّر الاتصال'}}}
const bgd=t=>t?new Date(Date.parse(t)+3*36e5).toISOString().slice(0,10):'';
const isAdmOrg=o=>String(o.phone||'').replace(/^0/,'')===PLATFORM.phone.replace(/^0/,'');
var DORM=14;const dormD=()=>(SETS&&SETS.follow&&+SETS.follow.dorm)||14;
function idleDays(o){const r=[o.last_login,o.last_entry,o.created_at].filter(Boolean).sort().pop();return r?Math.max(0,Math.floor((Date.now()-Date.parse(r))/864e5)):0}
function akey(o){const n=dLeft(o),paid=o.paid_until&&o.paid_until>=o.trial_until;if(o.suspended_at)return 'stop';if(n<=0)return 'end';if(n<=7)return 'soon';return paid?'paid':'trial'}
const AK_L={stop:'موقوف',end:'منتهي',soon:'ينتهي قريباً',paid:'مشترك',trial:'تجريبي'};
const AK_C={stop:'#8b95a7',end:'#B42318',soon:'#C98A00',paid:'#169C55',trial:'#14294A'};
const realOrgs=()=>(ADM.orgs||[]).filter(o=>!isAdmOrg(o));
const isDorm=o=>!o.suspended_at&&dLeft(o)>0&&idleDays(o)>dormD();
const isCall=o=>!o.suspended_at&&(!!o.renew||dLeft(o)<=7);
function callList(){return realOrgs().filter(isCall).sort((a,b)=>(!!b.renew-!!a.renew)||(dLeft(a)>0&&dLeft(b)>0?dLeft(a)-dLeft(b):dLeft(b)-dLeft(a)))}
const waTo=(o,t)=>`https://wa.me/${waNum(o.phone)}?text=${encodeURIComponent(t)}`;
function dlText(name,txt,type){const b=new Blob([txt],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function copyTxt(t,ok){const done=()=>toast(ok||'تم النسخ ✓');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(e){toast('حدّد النص وانسخه')}x.remove()})}
const numIn=v=>+(String(v||'').replace(/[^\d]/g,''))||0;

/* --- قوالب الرسائل --- */
const TPL_N={soon:'قرب انتهاء الاشتراك',end:'اشتراك منتهٍ',dorm:'مكتب راكد (ما يستخدم الحساب)',done:'تأكيد التفعيل'};
const TPL_D={
 soon:'السلام عليكم م. {الاسم}\nنودّ تذكيركم بأن {المدة} في نظام أسس تنتهي بعد {الأيام} يوم (بتاريخ {التاريخ}).\nبياناتكم محفوظة بالكامل، وللاستمرار في إضافة المبالغ يرجى التجديد بتحويل المبلغ عبر ماستر كارد إلى الرقم {رقم_الدفع} وإرسال صورة الوصل.\nالأسعار: {الأسعار} (لثلاثة أشهر).\nمع التقدير، إدارة أسس',
 end:'السلام عليكم م. {الاسم}\nنودّ إعلامكم بأن {المدة} في نظام أسس انتهت بتاريخ {التاريخ}.\nبياناتكم محفوظة بالكامل وللعرض فقط، وللاستمرار في إضافة المبالغ يرجى التجديد بتحويل المبلغ عبر ماستر كارد إلى الرقم {رقم_الدفع} وإرسال صورة الوصل.\nالأسعار: {الأسعار} (لثلاثة أشهر).\nمع التقدير، إدارة أسس',
 dorm:'السلام عليكم م. {الاسم}\nلاحظنا أنكم لم تستخدموا حسابكم في نظام أسس منذ {الخمول} يوماً. إذا تحتاجون مساعدة في البداية أو عندكم أي سؤال، نحن بالخدمة.\nمع التقدير، إدارة أسس',
 done:'السلام عليكم م. {الاسم}\nتم تفعيل اشتراككم في نظام أسس (باقة {الباقة}) وينتهي بتاريخ {التاريخ}.\nشكراً لثقتكم، إدارة أسس'};
function tplGet(k){return (SETS.tpl&&SETS.tpl[k])||TPL_D[k]}
function tplFill(k,o,x){const n=dLeft(o),paid=o.paid_until&&o.paid_until>=o.trial_until;x=x||{};
  const pr='فرد '+fmt(SETS.prices['فرد'][3])+' · فريق '+fmt(SETS.prices['فريق'][3])+' · مكتب '+fmt(SETS.prices['مكتب'][3]);
  const M={'الاسم':(o.owner||'').replace(/^م\.\s*/,''),'المكتب':o.name||'','التاريخ':(x.until||admEnd(o)||'').slice(0,10),'الأيام':Math.max(0,n),'المدة':paid?'مدة اشتراككم':'الفترة التجريبية','رقم_الدفع':payPhone(),'الأسعار':pr,'الخمول':idleDays(o),'الباقة':x.plan||o.plan||''};
  return tplGet(k).replace(/\{([^}]+)\}/g,(m,a)=>a in M?String(M[a]):m)}
remindMsg=function(o){return tplFill(dLeft(o)>0?'soon':'end',o)};

/* --- الدفعات والدخل --- */
var PAYS=null;
async function paysLoad(){let d=ADM.v6?await admTry({action:'payments'}):null;
  if(d&&!d._err&&d.payments){PAYS=d.payments;PAYS.part=false}
  else{PAYS=[];for(const o of ADM.orgs||[])for(const p of o.payments||[])PAYS.push(Object.assign({},p,{org_id:o.id,org_name:o.name,owner:o.owner}));PAYS.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));PAYS.part=true}
  if(V.v==='admin')render()}
const realPays=()=>(PAYS||[]).filter(p=>p.months>0);
const incOf=pre=>realPays().filter(p=>bgd(p.created_at).startsWith(pre)).reduce((s,p)=>s+(+p.amount||0),0);
function ymShift(ym,d){const[y,m]=ym.split('-').map(Number);const t=new Date(y,m-1+d,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')}
function repData(ym){const P=realPays().filter(p=>bgd(p.created_at).startsWith(ym));const O=realOrgs();
  return{inc:P.reduce((s,p)=>s+(+p.amount||0),0),ren:P.length,nw:O.filter(o=>bgd(o.created_at).startsWith(ym)).length,end:O.filter(o=>bgd(admEnd(o)).startsWith(ym)&&dLeft(o)<=0).length,act:O.filter(o=>!o.suspended_at&&dLeft(o)>0).length}}
function repTxt(ym){const d=repData(ym);return `تقرير «أسس» · ${monthName(ym)}\nالدخل: ${fmt(d.inc)} دينار\nعدد التجديدات: ${d.ren}\nمكاتب جديدة: ${d.nw}\nاشتراكات انتهت ولم تُجدَّد: ${d.end}\nالفعّالون الآن: ${d.act}`}

/* --- لوحة الإدارة (تبويبات مثل مندوبي) --- */
ADM.tab=ADM.tab||'ov';ADM.s=ADM.s||'pri';ADM.rm=ADM.rm||today().slice(0,7);
VIEWS.admin=()=>{const H=(p)=>`<header class="top short"><div class="hdr"><div><h1>لوحة إدارة أسس</h1><p>${p}</p></div><button class="back" onclick="go('more')">→</button></div></header>`;
  if(!ADM.orgs){admLoad();return H('لحظة…')+`<div class="wrap" style="margin-top:14px"><div class="card empty">جارٍ التحميل…</div></div>`}
  if(!PAYS){paysLoad()}
  if(!SETS.adm){SETS.adm=1;admSetsLoad()}
  const O=realOrgs(),call=callList().length;
  const tabs=[['ov','📊 نظرة عامة'],['orgs','🏢 المكاتب <span class="num">'+O.length+'</span>'],['pay','💳 الدفعات'],['tools','🛠️ الأدوات']];
  const body={ov:admOv,orgs:admOrgs,pay:admPay,tools:admTools}[ADM.tab]();
  return H(`<span class="num">${O.length}</span> مكتب مسجّل${call?' · <span class="num">'+call+'</span> يحتاجون متابعة':''}`)+`<div class="wrap" style="margin-top:14px">
   ${ADM.v6?'':'<div class="srvnote">🧪 <b>النسخة التجريبية:</b> الأرقام والتقارير والمتابعة والتصدير تعمل الآن. حفظ الأسعار والقوالب والإعلان والإشعارات، وتعديل الدفعات وسجل النشاط تعمل بعد «ارفع».</div>'}
   <div class="atabs">${tabs.map(([k,t])=>`<button class="${ADM.tab===k?'on':''}" onclick="ADM.tab='${k}';render();window.scrollTo(0,0)">${t}</button>`).join('')}</div>
   ${body}</div>`};
function admGo(f){ADM.tab='orgs';ADM.f=f;render();window.scrollTo(0,0)}

function admOv(){const t=today(),m=t.slice(0,7),pm=ymShift(m,-1),inc=incOf(m),pinc=incOf(pm),y=incOf(t.slice(0,4));
  let g='';if(pinc>0){const d=Math.round((inc-pinc)/pinc*100);g=`<span class="gw ${d>=0?'up':'dn'}">${d>=0?'↑':'↓'} <span class="num">${Math.abs(d)}%</span> عن الشهر الماضي</span>`}else if(inc>0)g='<span class="gw up">↑ أول دخل مسجّل</span>';
  const O=realOrgs();const rn=O.filter(o=>o.renew&&!o.suspended_at).length,soon=O.filter(o=>akey(o)==='soon').length,end=O.filter(o=>akey(o)==='end').length,nw=O.filter(o=>Date.now()-Date.parse(o.created_at)<7*864e5).length;
  const al=[];if(rn)al.push(['🔔',`<span class="num">${rn}</span> طلب تجديد بانتظار التفعيل`,'call']);if(soon)al.push(['⏰',`<span class="num">${soon}</span> ${soon===1?'اشتراك ينتهي':'اشتراكات تنتهي'} خلال 7 أيام`,'soon']);if(end)al.push(['⛔',`<span class="num">${end}</span> ${end===1?'اشتراك منتهٍ':'اشتراكات منتهية'} لم تُجدَّد`,'end']);if(nw)al.push(['🆕',`<span class="num">${nw}</span> ${nw===1?'مكتب جديد':'مكاتب جديدة'} هذا الأسبوع`,'new']);
  const cl=callList(),D=O.filter(isDorm).sort((a,b)=>idleDays(b)-idleDays(a));const r=repData(ADM.rm),cur=ADM.rm===m;
  return `<div class="hero"><div class="hl">دخل هذا الشهر</div><div class="hv"><span class="num">${fmt(inc)}</span> <small>دينار</small></div><div class="hs">${g}<span>هذه السنة: <b class="num">${fmt(y)}</b></span></div></div>
   ${al.length?`<div class="alist">${al.map(x=>`<button onclick="admGo('${x[2]}')"><span>${x[0]}</span><b>${x[1]}</b><em>‹</em></button>`).join('')}</div>`:''}
   ${cl.length?`<div class="callc"><span class="ci">📞</span><div style="flex:1" onclick="admGo('call')"><b>قائمة المتابعة</b><small><span class="num">${cl.length}</span> مكتب تحتاج إلى متابعة: ينتهي قريباً أو منتهي أو طلب تجديد</small></div><button onclick="bulkSheet()">تذكير جماعي</button></div>`:''}
   ${D.length?`<div class="dorm"><div class="dh"><span>💤</span><div><b>مكاتب راكدة (<span class="num">${D.length}</span>)</b><small>ما استخدموا حساباتهم أكثر من <span class="num">${dormD()}</span> يوماً. راسلهم حتى لا تفقدهم. <button class="lk" onclick="followSheet()">تغيير</button></small></div></div>
     ${D.slice(0,4).map(o=>`<div class="dr"><span class="av" style="background:#8b95a7">${esc((o.owner||o.name||'؟').replace(/^م\.\s*/,'').trim().charAt(0))}</span><div class="dn" onclick="admSheet('${o.id}')"><b>${esc(o.name)}</b><small>راكد منذ <span class="num">${idleDays(o)}</span> يوم · ${esc(AK_L[akey(o)])}</small></div><a class="ib wa" href="${waTo(o,tplFill('dorm',o))}" target="_blank" rel="noopener" aria-label="واتساب">💬</a></div>`).join('')}
     ${D.length>4?`<button class="more" onclick="admGo('dorm')">عرض الكل (<span class="num">${D.length}</span>) ‹</button>`:''}
     <div class="fn">يُحسب الخمول من آخر دخول أو آخر إضافة مبلغ أو تاريخ التسجيل.</div></div>`:''}
   <div class="rep"><div class="rh"><b>التقرير الشهري</b><div class="rm"><button onclick="ADM.rm=ymShift(ADM.rm,-1);render()" aria-label="الشهر السابق">›</button><span>${monthName(ADM.rm)}</span><button onclick="ADM.rm=ymShift(ADM.rm,1);render()" ${cur?'disabled':''} aria-label="الشهر التالي">‹</button></div></div>
    <div class="rg"><div><b class="num">${fmt(r.inc)}</b><span>الدخل (دينار)</span></div><div><b class="num">${r.ren}</b><span>تجديدات</span></div><div><b class="num">${r.nw}</b><span>مكاتب جديدة</span></div><div><b class="num" style="${r.end?'color:var(--red)':''}">${r.end}</b><span>انتهت ولم تُجدَّد</span></div></div>
    <div class="row2"><button class="btn ghost" style="margin:0" onclick="copyTxt(repTxt(ADM.rm),'نُسخ التقرير ✓')">📋 نسخ التقرير</button><a class="btn" style="margin:0;text-decoration:none;background:#25D366;color:#fff" href="https://wa.me/?text=${encodeURIComponent(repTxt(ADM.rm))}" target="_blank" rel="noopener">💬 واتساب</a></div>
    ${PAYS&&PAYS.part?'<div class="fn">الدخل محسوب من آخر 5 دفعات لكل مكتب. بعد «ارفع» يُحسب من السجل الكامل.</div>':''}</div>
`}

function admOrgs(){const O=realOrgs();const all=ADM.orgs;ADM.f=ADM.f||'all';
  const F={all:()=>true,call:isCall,paid:o=>akey(o)==='paid'||(akey(o)==='soon'&&o.paid_until>=o.trial_until),trial:o=>akey(o)==='trial'||(akey(o)==='soon'&&!(o.paid_until>=o.trial_until)),soon:o=>akey(o)==='soon',end:o=>akey(o)==='end',dorm:isDorm,stop:o=>!!o.suspended_at,new:o=>Date.now()-Date.parse(o.created_at)<7*864e5};
  const chips=[['all','الكل'],['call','متابعة'],['paid','مشترك'],['trial','تجريبي'],['soon','ينتهي قريباً'],['end','منتهي'],['dorm','راكد'],['stop','موقوف']].concat(ADM.f==='new'?[['new','جدد هذا الأسبوع']]:[]);
  const cnt=k=>(k==='all'?all:O).filter(F[k]).length;
  const so=[['pri','الأولوية'],['end','الأقرب انتهاءً'],['new','الأحدث تسجيلاً'],['ent','الأكثر مبالغ'],['paid','الأكثر دفعاً'],['idle','الأقدم نشاطاً']];
  const pri=o=>({end:1,soon:0,stop:4,trial:2,paid:3})[akey(o)]-(o.renew?1:0);
  const S_={pri:(a,b)=>pri(a)-pri(b)||dLeft(a)-dLeft(b),end:(a,b)=>dLeft(a)-dLeft(b),new:(a,b)=>String(b.created_at).localeCompare(String(a.created_at)),ent:(a,b)=>(b.entries||0)-(a.entries||0),paid:(a,b)=>(b.paid_total||0)-(a.paid_total||0),idle:(a,b)=>idleDays(b)-idleDays(a)};
  const q=(ADM.q||'').trim();const list=(ADM.f==='all'?all:O).filter(F[ADM.f]).filter(o=>!q||(o.name+' '+o.owner+' '+o.phone).includes(q)).sort(S_[ADM.s]);
  return `<div class="cats">${chips.map(([k,t])=>`<button class="${ADM.f===k?'on':''}" onclick="ADM.f='${k}';render()">${t} <span class="num">${cnt(k)}</span></button>`).join('')}</div>
   <div class="srow"><div class="fld" style="flex:1;margin:0"><div class="bx"><label for="adm-q">بحث بالاسم أو الرقم</label><input id="adm-q" value="${esc(ADM.q||'')}" oninput="ADM.q=this.value;clearTimeout(ADM.t);ADM.t=setTimeout(()=>{render();const i=$('#adm-q');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div></div>
    <div class="fld" style="margin:0;min-width:124px"><div class="bx"><label for="adm-s">ترتيب</label><select id="adm-s" onchange="ADM.s=this.value;render()">${so.map(([k,t])=>`<option value="${k}" ${ADM.s===k?'selected':''}>${t}</option>`).join('')}</select></div></div></div>
   ${ADM.f==='call'&&list.length?'<button class="btn" style="background:#25D366;color:#fff" onclick="bulkSheet()">💬 تذكير جماعي للكل</button>':''}
   <div class="list">${list.map(o=>{const k=akey(o);return `<button class="li" onclick="admSheet('${o.id}')"><div class="ic">🏢</div><div class="mid"><div class="t">${esc(o.name)} <span class="stc" style="background:${AK_C[k]}">${AK_L[k]}${k==='soon'?' · <span class="num">'+dLeft(o)+'</span> يوم':''}</span>${isDorm(o)?' <span class="stc" style="background:#8b95a7">💤 راكد</span>':''}</div>
     <div class="s">${esc(o.owner)} · <span class="num">${esc(o.phone)}</span> · <span class="num">${o.projects||0}</span> مشروع · <span class="num">${o.entries}</span> مبلغ · ${o.members} ${o.members===1?'مستخدم':'مستخدمين'}<br>🕒 آخر دخول: ${o.last_login?agoTxt(o.last_login):'—'}${o.paid_total?' · 💰 <span class="num">'+fmt(o.paid_total)+'</span>':''}${o.renew?'<br><b style="color:var(--yeld)">🔔 طلب تجديد · <span class="num">'+String(o.renew).slice(0,10)+'</span></b>':''}<br>💾 ${o.last_backup?'آخر نسخة <span class="num">'+bkWhen(o.last_backup).split(' · ')[0]+'</span> · '+o.backups+' نسخة':'<span style="color:var(--red)">لا توجد نسخة احتياطية</span>'}${o.note?'<br>📝 '+esc(o.note.slice(0,60)):''}</div></div><span class="chip n">‹</span></button>`}).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>
   <div class="row2"><button class="btn ghost" onclick="csvOrgs()">⬇️ تصدير Excel</button><button class="btn ghost" onclick="ADM.orgs=null;PAYS=null;render()">↻ تحديث</button></div>`}

function admPay(){if(!PAYS)return '<div class="card empty">جارٍ التحميل…</div>';const t=today(),R=realPays();const tot=R.reduce((s,p)=>s+(+p.amount||0),0);
  const mon={};R.forEach(p=>{const k=bgd(p.created_at).slice(0,7);mon[k]=(mon[k]||0)+(+p.amount||0)});const ks=Object.keys(mon).sort().reverse().slice(0,6),mx=Math.max(1,...ks.map(k=>mon[k]));
  return `<div class="tl3"><div><b class="num">${fmt(incOf(t.slice(0,7)))}</b><span>هذا الشهر</span></div><div><b class="num">${fmt(incOf(t.slice(0,4)))}</b><span>هذه السنة</span></div><div><b class="num">${fmt(tot)}</b><span>الإجمالي</span></div></div>
   ${ks.length?`<div class="bars"><h4>الدخل الشهري</h4>${ks.map(k=>`<div class="bi"><span>${monthName(k)}</span><i><u style="width:${Math.max(4,mon[k]/mx*100)}%"></u></i><b class="num">${fmt(mon[k])}</b></div>`).join('')}</div>`:''}
   <div class="sec"><h2>سجل الدفعات</h2><button class="chip n" style="display:inline-block!important" onclick="csvPays()">⬇️ Excel</button></div>
   ${PAYS.part?'<div class="fn" style="margin:0">يظهر آخر 5 دفعات لكل مكتب. السجل الكامل بعد «ارفع».</div>':''}
   <div class="list">${PAYS.length?PAYS.slice(0,200).map(p=>p.months>0?`<div class="li"><div class="mid"><div class="t">${esc(p.org_name||'')}</div><div class="s"><span class="num">${bgd(p.created_at)}</span> · ${esc(p.plan)} · ${moTxt(p.months)} · ${esc(p.method||'')}${p.receipt?' · '+esc(p.receipt):''}${p.extra_eng?' · +<span class="num">'+p.extra_eng+'</span> مهندس':''}</div></div>

async function tgFind(){const t=$('#tg-t').value.trim();if(!t)return toast('الصق رمز البوت أولاً');
  try{const r=await fetch('https://api.telegram.org/bot'+encodeURIComponent(t)+'/getUpdates');const d=await r.json();if(!d.ok)throw 0;const u=(d.result||[]).map(x=>x.message||x.my_chat_member||x.channel_post).filter(Boolean).pop();
    if(!u||!u.chat)return toast('أرسل كلمة start للبوت أولاً ثم أعد المحاولة');$('#tg-c').value=String(u.chat.id);toast('تم جلب المعرّف ✓')}catch(e){toast('الرمز غير صحيح أو لا يوجد اتصال')}}
async function tgTest(){const t=$('#tg-t').value.trim(),c=$('#tg-c').value.trim();if(!t||!c)return toast('أدخل الرمز والمعرّف أولاً');
  try{const r=await fetch('https://api.telegram.org/bot'+encodeURIComponent(t)+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:c,text:'✅ تجربة إشعارات لوحة إدارة أسس'})});const d=await r.json();toast(d.ok?'أُرسلت رسالة التجربة ✓ تحقق من تيليجرام':'ما وصلت: تأكد من الرمز والمعرّف')}catch(e){toast('لا يوجد اتصال')}}
function waTest(){const p=$('#wa-p').value.replace(/\D/g,''),k=$('#wa-k').value.trim();if(!p||!k)return toast('أدخل الرقم والرمز أولاً');
  fetch('https://api.callmebot.com/whatsapp.php?phone='+p+'&apikey='+encodeURIComponent(k)+'&text='+encodeURIComponent('✅ تجربة إشعارات لوحة إدارة أسس'),{mode:'no-cors'}).then(()=>toast('أُرسلت ✓ تحقق من الواتساب خلال دقيقة'),()=>toast('لا يوجد اتصال'))}
async function ntfSave(){const v={tg_token:$('#tg-t').value.trim(),tg_chat:$('#tg-c').value.trim(),tg_on:$('#tg-on').checked,wa_phone:$('#wa-p').value.replace(/\D/g,''),wa_key:$('#wa-k').value.trim(),wa_on:$('#wa-on').checked};
  if(v.tg_on&&(!v.tg_token||!v.tg_chat))return toast('أدخل رمز البوت والمعرّف أولاً');if(v.wa_on&&(!v.wa_phone||!v.wa_key))return toast('أدخل الرقم والرمز أولاً');

function payFind(id,org){if(PAYS){const p=PAYS.find(x=>x.id===id);if(p)return p}const o=(ADM.orgs||[]).find(x=>x.id===org);return o&&(o.payments||[]).find(x=>x.id===id)}
function payEdit(id,org){if(!id||!ADM.v6)return toast(NEEDSRV);const p=payFind(id,org);if(!p)return;const o=(ADM.orgs||[]).find(x=>x.id===org)||{};ADM.pe={id,org,m:p.months};
  sheet(shd('✏️ تعديل دفعة',esc(o.name||p.org_name||'')+' · بتاريخ <span class="num">'+bgd(p.created_at)+'</span>')+`
   <div class="mut" style="font-size:13px;font-weight:700">المدة</div><div class="cats" id="pe-m">${[[1,'شهر'],[6,'6 أشهر'],[12,'سنة']].map(([m,t])=>`<button class="${p.months===m?'on':''}" data-k="${m}" onclick="admPick(this);ADM.pe.m=${m};peHint()">${t}</button>`).join('')}</div>
   ${fin('pe-a','المبلغ (دينار)',fmt(p.amount),'class="num" inputmode="numeric" oninput="this.value=fmt(numIn(this.value))"')}
   ${fin('pe-r','رقم الوصل أو ملاحظة',p.receipt||'')}
   <label class="ck"><input type="checkbox" id="pe-adj" checked onchange="peHint()"> عدّل تاريخ الاشتراك تلقائياً بفرق المدة</label>
   <div class="note" id="pe-h" style="margin:0"></div>
   <button class="btn y" onclick="paySave()">✓ حفظ التعديل</button><button class="btn ghost" onclick="${ADM.tab==='pay'&&V.v==='admin'?'closeSheet()':`admSheet('${org}')`}">رجوع</button>`);peHint()}
function peHint(){const p=payFind(ADM.pe.id,ADM.pe.org);const d=ADM.pe.m-p.months,adj=$('#pe-adj').checked;$('#pe-h').innerHTML=!d?'المدة نفسها، ولا يتغيّر تاريخ الانتهاء.':adj?`تاريخ الانتهاء ${d>0?'يزيد':'ينقص'} <b class="num">${Math.abs(d)}</b> ${Math.abs(d)===1?'شهر':'أشهر'}.`:'يبقى تاريخ الانتهاء كما هو.'}
async function paySave(){const a=numIn($('#pe-a').value);const d=await admTry({action:'pay_edit',id:ADM.pe.id,org_id:ADM.pe.org,months:ADM.pe.m,amount:a,receipt:$('#pe-r').value.trim(),adjust:$('#pe-adj').checked});
  if(d._err)return toast(d.msg);toast('تم تعديل الدفعة ✓');await admReload();PAYS=null;await paysLoad();if(ADM.tab==='pay'&&V.v==='admin')closeSheet();else admSheet(ADM.pe.org)}
function payDel(id,org){if(!id||!ADM.v6)return toast(NEEDSRV);const p=payFind(id,org);if(!p)return;
  sheet(`<h3 style="color:var(--red)">🗑️ حذف دفعة</h3><p style="margin:0;line-height:1.9">${esc(p.org_name||'')} · ${esc(p.plan)} · ${moTxt(p.months)} · <b class="num">${fmt(p.amount)}</b> د.ع · <span class="num">${bgd(p.created_at)}</span><br>تُحذف الدفعة من السجل ومن حساب الدخل.</p>
   <label class="ck"><input type="checkbox" id="pd-adj" checked> انقص <span class="num">${p.months}</span> ${p.months===1?'شهر':'أشهر'} من تاريخ انتهاء الاشتراك</label>
   <button class="btn" style="background:var(--red);color:#fff" id="pd-go" onclick="payDelGo(${id},'${org}')">حذف الدفعة</button><button class="btn ghost" onclick="${ADM.tab==='pay'&&V.v==='admin'?'closeSheet()':`admSheet('${org}')`}">رجوع</button>`)}
async function payDelGo(id,org){const b=$('#pd-go');b.disabled=true;b.textContent='لحظة…';const d=await admTry({action:'pay_del',id,org_id:org,adjust:$('#pd-adj').checked});
  if(d._err){b.disabled=false;b.textContent='حذف الدفعة';return toast(d.msg)}toast('حُذفت الدفعة');await admReload();PAYS=null;await paysLoad();if(ADM.tab==='pay'&&V.v==='admin')closeSheet();else admSheet(org)}

function driveScript(tok){return `// نسخة أسس الأسبوعية إلى Google Drive — لا تشارك هذا السكربت مع أحد
const URL_ = 'https://nlwlopwewqebdawkgtbk.supabase.co/functions/v1/asas-offsite';
const TOKEN = '${tok||'ضع_الرمز_هنا'}';
const KEEP = 8; // عدد النسخ اللي تبقى بالمجلد

function weeklyBackup() {
  const call = (body) => UrlFetchApp.fetch(URL_, {method: 'post', contentType: 'application/json',
    headers: {'x-drive-token': TOKEN}, payload: JSON.stringify(body), muteHttpExceptions: true});
  const r = call({action: 'drive'});
  const ok = r.getResponseCode() === 200;
  let bytes = 0;
  if (ok) {
    const it = DriveApp.getFoldersByName('نسخ أسس');
    const folder = it.hasNext() ? it.next() : DriveApp.createFolder('نسخ أسس');
    const name = 'asas-backup-' + Utilities.formatDate(new Date(), 'Asia/Baghdad', 'yyyy-MM-dd') + '.json.gz.enc';
    const blob = r.getBlob().setName(name); bytes = blob.getBytes().length;
    folder.createFile(blob);
    const files = []; const fi = folder.getFiles(); while (fi.hasNext()) files.push(fi.next());
    files.sort((a, b) => b.getDateCreated() - a.getDateCreated()).slice(KEEP).forEach(f => f.setTrashed(true));
  }
  call({action: 'drive_report', ok: ok, bytes: bytes});
  if (!ok) throw new Error('فشلت نسخة أسس الأسبوعية: ' + r.getResponseCode());
}`}

/* ============ صافي المهندس + الموظفون والعهدة ============ */
/* مصروف المكتب = حركة kind:'out' و pid:'office' (لا يظهر بكشف الزبون).
   العهدة: kind:'cg' (أعطيته) و kind:'cr' (استلمت منه)، pid:'office'، cu = رقم الموظف.
   أي حركة يسجّلها الموظف تحمل cu = رقمه، فتنزل من عهدته ولا تُحسب على الصندوق مرة ثانية. */
let DEMO_AS=null,FULL=null,TM_LOADED=false;
Object.defineProperty(window,'AS',{configurable:true,get(){if(DEMO_AS)return DEMO_AS;
  if(MODE==='cloud'&&ME&&ME.role!=='owner'&&Array.isArray(ME.projects))return{uid:ME.uid,name:ME.name,projects:ME.projects};return null}});
const LOCK_MSG='الموظف يعدّل صرفه بنفس اليوم فقط، وبعدها التعديل لصاحب الحساب';
function canEditE(e){if(!e||!AS)return true;if(e.kind==='cg'||e.kind==='cr')return false;return e.cu===AS.uid&&today(new Date(e.ts||0))===today()}
function TEAM(){if(MODE==='cloud')return MEMBERS.filter(m=>m.role!=='owner').map(m=>({uid:m.user_id,name:m.name,phone:m.phone,job:ROLE_N[roleOf(m)],projects:Array.isArray(m.projects)?m.projects:null,active:m.active}));
  const S0=FULL||S;return S0.team||(S0.team=[])}
function tmName(u){const t=TEAM().find(x=>x.uid===u);return t?t.name:(AS&&AS.uid===u?AS.name:'موظف')}
function custOf(u){const S0=FULL||S;let g=0,r=0,sp=0,col=0;const L=[];
  for(const e of live(S0.entries)){if(e.cu!==u)continue;if(e.pid!=='office'){const p=S0.projects.find(x=>x.id===e.pid);if(!p||p.del)continue}
    L.push(e);if(e.kind==='cg')g+=e.amt;else if(e.kind==='cr')r+=e.amt;else if(e.kind==='out')sp+=e.amt;else if(e.kind==='in')col+=e.amt}
  L.sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));return{g,r,sp,col,left:g+col-sp-r,L}}

/* ---- الأتعاب بتاريخ كل دفعة، ومصاريف المكتب ---- */
function feesIn(a,b){const rows=[];let tot=0;
  for(const p of live(S.projects)){const es=live(S.entries).filter(e=>e.pid===p.id&&e.kind==='in').sort((x,y)=>x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0));if(!es.length)continue;let f=0;
    if(p.feeType==='pct'){const pc=(+p.feeVal||0)/100;for(const e of es)if(e.date>=a&&e.date<=b)f+=Math.round(e.amt*pc)}
    else if(+p.feeVal&&es[0].date>=a&&es[0].date<=b)f=+p.feeVal;
    if(f){rows.push({p,f});tot+=f}}
  return{tot,rows:rows.sort((x,y)=>y.f-x.f)}}
const offIn=(a,b)=>live(S.entries).filter(e=>e.pid==='office'&&e.kind==='out'&&e.date>=a&&e.date<=b).sort((x,y)=>y.date.localeCompare(x.date)||(y.ts||0)-(x.ts||0));
function netOf(a,b){const f=feesIn(a,b),ex=offIn(a,b),e=ex.reduce((s,x)=>s+x.amt,0);return{f:f.tot,fr:f.rows,ex,e,n:f.tot-e}}
function grpDet(ex){const by={};for(const e of ex){const k=(e.det||'—').trim();(by[k]=by[k]||{k,n:0,a:0}).a+=e.amt;by[k].n++}return Object.values(by).sort((x,y)=>y.a-x.a)}
const nextYm=ym=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
function monthsIn(a,b){const out=[];for(let ym=a.slice(0,7);ym<=b.slice(0,7);ym=nextYm(ym)){const q=netOf(ym+'-01',ym+'-31');out.push({ym,...q})}return out}

const NP={k:'m',m:today().slice(0,7),y:+today().slice(0,4),from:today().slice(0,8)+'01',to:today()};
function npRange(){if(NP.k==='m')return[NP.m+'-01',NP.m+'-31'];if(NP.k==='y')return[NP.y+'-01-01',NP.y+'-12-31'];return NP.from<=NP.to?[NP.from,NP.to]:[NP.to,NP.from]}
function npLabel(){const r=npRange();if(NP.k==='m')return monthName(NP.m);if(NP.k==='y')return 'سنة '+NP.y;return 'من '+r[0]+' إلى '+r[1]}

  if(NP.k==='m'&&g('np-m'))NP.m=g('np-m');if(NP.k==='y'&&g('np-y'))NP.y=+g('np-y');if(NP.k==='r'){if(g('np-from'))NP.from=g('np-from');if(g('np-to'))NP.to=g('np-to')}render()}
function npSet(k){NP.k=k;render()}
function npQuick(w){if(w==='tm'){NP.k='m';NP.m=today().slice(0,7)}else if(w==='pm'){NP.k='m';NP.m=prevYm(today().slice(0,7))}render()}

function feeRows(a,b){const rows=[];
  for(const p of live(S.projects)){const es=live(S.entries).filter(e=>e.pid===p.id&&e.kind==='in').sort((x,y)=>x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0));if(!es.length)continue;
    if(p.feeType==='pct'){const pc=+p.feeVal||0;for(const e of es)if(e.date>=a&&e.date<=b){const f=Math.round(e.amt*pc/100);if(f)rows.push({p,e,f,pc})}}
    else if(+p.feeVal&&es[0].date>=a&&es[0].date<=b)rows.push({p,e:es[0],f:+p.feeVal,fixed:true})}
  return rows.sort((x,y)=>y.e.date.localeCompare(x.e.date))}
function npBody(){const cy=new Date().getFullYear();const ys=[...new Set(live(S.entries).map(e=>+String(e.date).slice(0,4)).filter(Boolean).concat([cy]))].sort((x,y)=>y-x);
  return `<h3>اختر الفترة</h3>
  <div class="nfseg nf4">${[['tm','هذا الشهر'],['m','شهر'],['y','سنة'],['r','فترة']].map(([k,n])=>`<button class="${(k==='tm'?(NP.k==='m'&&NP.m===today().slice(0,7)):(NP.k===k&&!(k==='m'&&NP.m===today().slice(0,7))))?'on':''}" onclick="npK('${k}')">${n}</button>`).join('')}</div>
  <div style="margin-top:12px">
  ${NP.k==='m'?`<div class="dpw"><label>الشهر</label>${dpk('np-m',NP.m,'m')}</div>`:''}
  ${NP.k==='y'?`<div class="dpw"><label for="np-y">السنة</label><select id="np-y" class="num">${ys.map(y=>`<option value="${y}" ${y===NP.y?'selected':''}>${y}</option>`).join('')}</select></div>`:''}
  ${NP.k==='r'?`<div class="dpw"><label>من</label>${dpk('np-from',NP.from)}</div><div class="dpw"><label>إلى</label>${dpk('np-to',NP.to)}</div>`:''}
  </div><button class="btn" style="margin-top:14px;width:100%" onclick="npApply()">عرض</button>`}
function npSheet(){sheet(npBody())}
function npK(k){npGrab();if(k==='tm'){NP.k='m';NP.m=today().slice(0,7);closeSheet();render();return}NP.k=k;sheet(npBody())}
function npGrab(){const g=id=>{const el=$('#'+id);return el?el.value:null};
  if(NP.k==='m'&&g('np-m'))NP.m=g('np-m');if(NP.k==='y'&&g('np-y'))NP.y=+g('np-y');if(NP.k==='r'){if(g('np-from'))NP.from=g('np-from');if(g('np-to'))NP.to=g('np-to')}}
function npApply(){npGrab();closeSheet();render()}
function npChip(){if(NP.k==='m')return NP.m===today().slice(0,7)?'هذا الشهر':monthName(NP.m);if(NP.k==='y')return 'سنة '+NP.y;const r=npRange();return r[0]+' — '+r[1]}

function htNums(){const[a,b]=npRange();let inn=0,out=0,ni=0,no=0;const ins=[],outs=[];

  const R=netOf(a,b);const us=[...new Set(live(S.entries).filter(e=>e.cu).map(e=>e.cu))];let cust=0,cn=0;for(const u of us){const l=custOf(u).left;if(l){cust+=l;cn++}}
  const srt=x=>x.sort((p,q)=>q.date.localeCompare(p.date)||(q.ts||0)-(p.ts||0));
  return{a,b,inn,out,ins:srt(ins),outs:srt(outs),R,cust,cn}}

function rpShrink1(src,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q))};im.onerror=()=>res(src);im.src=src})}
async function rpShrink(html){for(const [max,q] of [[800,.6],[600,.5],[420,.45]]){if(html.length<2.7e6)break;const srcs=[...new Set((html.match(/data:image\/[a-z]+;base64,[A-Za-z0-9+/=]+/g)||[]).filter(s=>s.length>30000))];
    for(const s of srcs){const n=await rpShrink1(s,max,q);if(n.length<s.length)html=html.split(s).join(n)}}return html}
function rpSB(){if(!SB||SB.__rp)return;const o=SB.rpc.bind(SB);SB.rpc=async function(n,a){if(n==='asas_share_create'&&a&&a.p_html&&a.p_html.length>2.7e6)a=Object.assign({},a,{p_html:await rpShrink(a.p_html)});return o(n,a)};SB.__rp=1}

{const _mMS=VIEWS.more;VIEWS.more=a=>{let h=_mMS(a);if(DEMO_AS)return h;

   <button class="btn ghost" onclick="closeSheet()">إلغاء</button>`)}

/* ===== 1.9.14: العدد مع المعدود بالفصحى + التواريخ يوم/شهر/سنة بكل النظام ===== */
/* «8 حركة» ← «8 حركات»، «2 موظف» ← «موظفان»، «15 مشروع» ← «15 مشروعاً». «2026-11-19» ← «19/11/2026». يعمل على النص المعروض فقط. */
const LT_W={'حركة':['حركتان','حركات','حركة'],'مشروع':['مشروعان','مشاريع','مشروعاً'],'موظف':['موظفان','موظفين','موظفاً'],'زبون':['زبونان','زبائن','زبوناً'],
 'دفعة':['دفعتان','دفعات','دفعة'],'عنصر':['عنصران','عناصر','عنصراً'],'طلب':['طلبان','طلبات','طلباً'],'يوم':['يومان','أيام','يوماً'],'صورة':['صورتان','صور','صورة'],'مهندس':['مهندسان','مهندسين','مهندساً'],'مساعد':['مساعدان','مساعدين','مساعداً']};
function ltForm(n,w){const f=LT_W[w];if(!f)return null;const m=n%100;if(n===1||(n>100&&(m===1||m===2))||(n>=100&&m===0))return [String(n),w];if(n===2)return ['',f[0]];
  if(m>=3&&m<=10)return [String(n),f[1]];if(m===0)return [String(n),f[1]];return [String(n),f[2]]}
const LT_RE=new RegExp('(^|[^\\d\\u0600-\\u06FF])(\\d+) ('+Object.keys(LT_W).join('|')+')(?![\\u0600-\\u06FF\\u064B-\\u0652])','g');
const LT_LEAD=new RegExp('^(\\s)('+Object.keys(LT_W).join('|')+')(?![\\u0600-\\u06FF\\u064B-\\u0652])');
const LT_DATE=/(^|[^\w\-\/])(\d{4})-(\d{2})-(\d{2})(?![\w\-])/g;
function ltNum(s){return +String(s).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[^\d]/g,'')}
function ltText(t){if(!t.nodeValue||!/\d/.test(t.nodeValue+(t.previousSibling&&t.previousSibling.textContent||'')))return;
  const p=t.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT|TITLE)$/.test(p.nodeName)||p.isContentEditable)return;
  let v=t.nodeValue;const o=v;
  v=v.replace(LT_DATE,(a,b,y,m,d)=>b+d+'/'+m+'/'+y);
  v=v.replace(LT_RE,(a,b,n,w)=>{const f=ltForm(+n,w);return f?b+(f[0]?f[0]+' ':'')+f[1]:a});
  const ps=t.previousSibling;const mm=v.match(LT_LEAD);
  if(mm&&ps&&ps.nodeType===1&&/^\s*[\d٠-٩][\d٠-٩,،]*\s*$/.test(ps.textContent)){const f=ltForm(ltNum(ps.textContent),mm[2]);
    if(f){v=v.replace(LT_LEAD,(f[0]?'$1':'')+f[1]);if(!f[0])ps.textContent=''}}
  if(v!==o)t.nodeValue=v}
function ltWalk(root){if(!root)return;if(root.nodeType===3)return ltText(root);if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const L=[];while((n=w.nextNode()))L.push(n);L.forEach(ltText)}
try{const ltObs=new MutationObserver(ms=>{ltObs.disconnect();for(const m of ms){if(m.type==='characterData')ltText(m.target);else m.addedNodes.forEach(ltWalk)}ltObs.observe(document.body,{childList:true,subtree:true,characterData:true})});
  ltObs.observe(document.body,{childList:true,subtree:true,characterData:true});ltWalk(document.body)}catch(e){}

/* ===== 1.9.15 اختيار المشروع بمربعات (20 حسب آخر حركة + عرض الكل + بحث في الأعلى) ===== */
const PG_TOP=20,PG_SEARCH=8;
function pgOrder(ps){const last={};for(const e of live(S.entries))last[e.pid]=Math.max(last[e.pid]||0,e.ts||0);return ps.slice().sort((a,b)=>(last[b.id]||0)-(last[a.id]||0))}
function pgTile(p,cur,fn,x){const c=C(p.cid)||{};return `<button class="pgt ${p.id===cur?'on':''} ${x?'pgx':''}" ${x?'hidden':''} data-q="${esc((cName(c)+' '+p.name).toLowerCase())}" onclick="${fn}('${p.id}')"><b>${esc(cName(c))}</b><span>${esc(p.name)}</span></button>`}
function pgGrid(o){const ps=pgOrder(o.ps),n=ps.length,many=n>PG_TOP&&!o.all;let top=ps;
  if(many){top=ps.slice(0,PG_TOP);if(o.cur&&o.cur!=='office'&&!top.some(p=>p.id===o.cur)){const x=ps.find(p=>p.id===o.cur);if(x)top[PG_TOP-1]=x}}
  const rest=many?ps.filter(p=>!top.includes(p)):[];
  const off=o.office?`<button class="pgt off ${o.cur==='office'?'on':''}" data-q="المكتب" onclick="${o.fn}('office')"><b>🏢 المكتب</b><span>يُخصم من الأتعاب، ولا يظهر للزبون</span></button>`:'';
  return `<div class="pgw">${n>PG_SEARCH?`<input class="pgs" type="search" enterkeyhint="search" placeholder="🔍 ابحث باسم الزبون أو المشروع" oninput="pgFilter(this)">`:''}
   <div class="pgrid">${off}${top.map(p=>pgTile(p,o.cur,o.fn)).join('')}${rest.map(p=>pgTile(p,o.cur,o.fn,1)).join('')}</div>${n?'':'<div class="empty">أضف مشروعاً أولاً</div>'}
   <div class="pgnone" hidden>لا توجد نتيجة</div>
   ${many?`<button class="pgall" onclick="${o.allFn}()">عرض كل المشاريع (<span class="num">${n}</span>)</button>`:''}</div>`}
/* البحث يشمل كل المشاريع حتى غير الظاهرة */
function pgFilter(inp){const t=inp.value.trim().toLowerCase(),w=inp.parentNode;let k=0;
  w.querySelectorAll('.pgt').forEach(b=>{const ok=t?b.dataset.q.includes(t):!b.classList.contains('pgx');b.hidden=!ok;if(ok)k++});
  const z=w.querySelector('.pgnone');if(z)z.hidden=!!k||!t;const a=w.querySelector('.pgall');if(a)a.hidden=!!t}
/* الإدخال السريع */
function qPick(id){Q.pid=id;qNext()}
function qAll(){Q.all=true;render()}
/* النموذج الكامل */
function pgLabel(id){if(id==='office')return '🏢 المكتب';const p=P(id);if(!p)return 'اختر';return esc(cName(C(p.cid)||{}))+' · '+esc(p.name)}
function pgFormOpts(){const isIn=F.kind==='in';return{ps:live(S.projects).filter(p=>!p.done||p.id===F.pid),cur:F.pid,office:!isIn&&(!pvSolo()||F.pid==='office'),fn:'pgSet',allFn:'pgOpenAll'}}
function pgOpen(all){if(!all)readF();const isIn=F.kind==='in';
  sheet(`<h3>${isIn?'الزبون / المشروع':'يُحسب هذا المصروف على:'}</h3>${pgGrid(Object.assign(pgFormOpts(),{all:!!all}))}<button class="btn ghost" onclick="closeSheet()">إغلاق</button>`)}
function pgOpenAll(){pgOpen(true)}
function pgSet(id){F.pid=id;closeSheet();render()}
/* شريط «على:» يُظهر المشروع المختار في كل الخطوات بعد الاختيار */
function pgName(id){if(id==='office')return '🏢 المكتب';const p=P(id);if(!p)return '';return esc(cName(C(p.cid)||{}))+' · '+esc(p.name)}
function qOnBar(k){if(!Q||!Q.pid||k==='pid')return '';const st=qSteps(),ip=st.indexOf('pid');if(Q.step<ip&&!Q.fixP)return '';
  const p=P(Q.pid),off=Q.pid==='office';
  return `<div class="qon"><div class="qon-t"><small>${Q.kind==='in'?'المبلغ من':'يُحسب على'}</small><b>${off?'🏢 المكتب':esc(cName(C(p&&p.cid)||{}))}</b>${off?'<span>يُخصم من الأتعاب، ولا يظهر للزبون</span>':p?`<span>${esc(p.name)}</span>`:''}</div><button onclick="qToPid()">تغيير</button></div>`}
function qToPid(){qRead();Q.fixP=false;Q.step=qSteps().indexOf('pid');render()}
/* الصنف والملاحظة: ① اختر الصنف (مربعات بأيقونات) ② اكتب ملاحظة */
const CN_IC={mat:'🧱',lab:'👷',eq:'🚜',tr:'🚚',oth:'📦'};
QT.det='';
function cnChips(T){const on=(k,x)=>x?T.catx===x:(!T.catx&&T.cat===k);
  return CATS.map(c=>`<button type="button" data-k="${c.k}" class="${on(c.k)?'on':''}" onclick="cnSet('${c.k}','')"><i>${CN_IC[c.k]||'🏷️'}</i><b>${c.n}</b></button>`).join('')
   +cnCustoms().map(x=>`<button type="button" data-x="${esc(x)}" class="${on('oth',x)?'on':''}" onclick="cnSet('oth',this.dataset.x)"><i>🏷️</i><b>${esc(x)}</b></button>`).join('')
   +`<button type="button" class="cn-add" onclick="cnAdd()"><i>➕</i><b>صنف جديد</b></button>`}
function qDetBody(){if(Q.pid==='office')return `<input id="q-det" class="qin" placeholder="مثلاً: أجور العامل أحمد" value="${esc(Q.det)}" autocomplete="off">`;
  return `<div class="qdet-box"><div class="cnh"><span class="num">1</span>اختر الصنف</div><div class="qcats cngrid" id="f-cats">${cnChips(Q)}</div>
   <div class="cnh"><span class="num">2</span>اكتب ملاحظة <small>(اختياري)</small></div><input id="q-det" class="qin" placeholder="مثلاً: 3 عمال لصب السقف" value="${esc(Q.det&&Q.det!==catLab(Q)?Q.det:'')}" autocomplete="off"></div>`}
function entCatBox(isIn){
  if(isIn||F.pid==='office')return `<div class="fld"><div class="ic">📝</div><div class="bx"><label for="f-det">${F.pid==='office'?'التفاصيل':'البيان'}</label><input id="f-det" value="${esc(F.det)}" placeholder="${isIn?'دفعة أولى':'مثلاً: أجور العامل أحمد، إيجار المكتب'}"></div></div>`;
  return `<div class="fld cnbox"><div class="bx"><div class="cnh"><span class="num">1</span>اختر الصنف</div><div class="cats cn-cats cngrid" id="f-cats">${cnChips(F)}</div>
   <label for="f-det" class="cnh"><span class="num">2</span>اكتب ملاحظة <small>(اختياري)</small></label><input id="f-det" class="cn-in" value="${esc(F.det===catLab(F)?'':F.det)}" placeholder="مثلاً: 3 عمال لصب السقف" autocomplete="off"></div></div>`}

boot();
</script>
